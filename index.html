function hitungRingkasanProduksiStandarPerR(){
  const jadiEl = document.getElementById('rp-jadi');
  if(!jadiEl) return;
  let totalJadi = 0, totalCek = 0, totalDiambil = 0, adaDiambil = false;
  document.querySelectorAll('#produksi-varian-tbody tr[data-varian-row]').forEach(tr=>{
    const inp = tr.querySelector('.produksi-varian-input');
    const diambilInp = tr.querySelector('.produksi-varian-diambil-input');
    const cekEl = tr.querySelector('[data-cek-for]');
    const selisihRowEl = tr.querySelector('[data-selisih-row-for]');
    const aktual = parseFloat(inp.value)||0;
    const standar = parseFloat(inp.dataset.standar)||0;
    totalJadi += aktual;
    let cek = 0;
    if(standar>0){
      cek = aktual/standar;
      totalCek += cek;
      if(cekEl){ cekEl.textContent = cek.toLocaleString('id-ID',{maximumFractionDigits:2}); }
    } else if(cekEl){ cekEl.textContent = '-'; }
    const diambilRaw = diambilInp ? diambilInp.value : '';
    if(diambilRaw!==''){
      const diambil = parseFloat(diambilRaw)||0;
      totalDiambil += diambil; adaDiambil = true;
      const selisihRow = cek - diambil;
      if(selisihRowEl){ selisihRowEl.textContent = (selisihRow>0?'+':'')+selisihRow.toLocaleString('id-ID',{maximumFractionDigits:2}); selisihRowEl.className = 'selisih-badge '+(Math.abs(selisihRow)<=0.5?'sisa-ok':'sisa-low'); }
    } else if(selisihRowEl){ selisihRowEl.textContent = '-'; selisihRowEl.className = 'selisih-badge'; }
  });
  jadiEl.textContent = totalJadi.toLocaleString('id-ID')+' '+(document.querySelector('.produksi-varian-input')?.dataset.satuan||'pcs');
  const cekTotalEl = document.getElementById('rp-cek-total');
  if(cekTotalEl) cekTotalEl.textContent = totalCek.toLocaleString('id-ID',{maximumFractionDigits:1});
  const diambilTotalEl = document.getElementById('rp-diambil-total');
  if(diambilTotalEl) diambilTotalEl.textContent = adaDiambil ? totalDiambil.toLocaleString('id-ID',{maximumFractionDigits:2}) : '-';
  const selisihEl = document.getElementById('rp-selisih-resep');
  const selisihBox = document.getElementById('rp-selisih-resep-box');
  if(selisihEl){
    if(!adaDiambil){ selisihEl.textContent='-'; if(selisihBox) selisihBox.className='stat'; }
    else{
      const selisih = totalCek - totalDiambil;
      selisihEl.textContent = (selisih>0?'+':'')+selisih.toLocaleString('id-ID',{maximumFractionDigits:2});
      if(selisihBox) selisihBox.className = 'stat '+(Math.abs(selisih)<=0.5?'pos':'neg');
    }
  }
}

const SUPABASE_URL = 'https://iqhozesxcwlsejnmrwey.supabase.co';
const SUPABASE_KEY = 'sb_publishable_doaiLiO_7KEk68e6zSIUdA_vm0LrFJ1';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const DATASETS_DB = ['items','trx','produksi','packing','penjualan','opname','retur','riwayatEdit'];
let dbStatus = 'connecting'; // 'connecting' | 'online' | 'offline'

// state pembangun resep (tab Kode)

let resepBuilderKgStandar='';

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
// Acuan Konversi sekarang berupa DAFTAR (per varian/ukuran), karena 1 premix bisa
// punya beberapa varian dengan rasio pcs/kg & isi/box yang beda-beda (cth: Kecil vs Besar).
// Helper ini juga mengangkat data lama (format objek tunggal) jadi 1 baris list, tanpa
// perlu migrasi/tulis ulang data tersimpan.
function getAkList(it){
  if(!it) return [];
  if(Array.isArray(it.acuanKonversiList)) return it.acuanKonversiList;
  const ak = it.acuanKonversi;
  if(ak && ak.pcsPerKgMin!=null && ak.pcsPerKgMin!==''){
    return [{ id:'legacy', nama:'Standar', pcsPerKgMin:ak.pcsPerKgMin, pcsPerKgMax:ak.pcsPerKgMax, isiPerBox:ak.isiPerBox, berkurangBoxPercent:ak.berkurangBoxPercent }];
  }
  return [];
}
function rupiah(n){ return 'Rp'+Math.round(n||0).toLocaleString('id-ID'); }
function today(){ return new Date().toISOString().slice(0,10); }
function nextKode(kategori){
  const pfx = {premix:'PMX', bahan:'BHN', kardus:'KRD'}[kategori];
  const n = items.filter(i=>i.kategori===kategori).length + 1;
  return pfx + String(n).padStart(3,'0');
}

async function loadAll(){
  for(const k of DATASETS_DB){
    try{
      const { data, error } = await sb.from(k).select('data').order('created_at', {ascending:true});
      if(error) throw error;
      window[k+'__tmp'] = (data||[]).map(r=>r.data);
      dbStatus = 'online';
    }catch(e){
      console.error('Gagal memuat', k, e);
      window[k+'__tmp'] = window[k+'__tmp'] || [];
      dbStatus = 'offline';
    }
  }
  items=items__tmp; trx=trx__tmp; produksi=produksi__tmp; packing=packing__tmp; penjualan=penjualan__tmp; opname=opname__tmp; retur=retur__tmp; riwayatEdit=riwayatEdit__tmp;
}
async function save(key, val){
  try{
    // sinkron penuh: hapus semua baris tabel ini, lalu simpan ulang isi array saat ini
    const { error: delErr } = await sb.from(key).delete().neq('id','__never_matches__');
    if(delErr) throw delErr;
    if(val.length>0){
      const rows = val.map(rec=>({id: rec.id, data: rec}));
      const { error: insErr } = await sb.from(key).insert(rows);
      if(insErr) throw insErr;
    }
    dbStatus = 'online';
    updateDbStatusBadge();
  }catch(e){
    console.error('Gagal menyimpan', key, e);
    dbStatus = 'offline';
    updateDbStatusBadge();
    alert('Gagal menyimpan ke database online. Cek koneksi internet, lalu coba lagi. Perubahan barusan mungkin belum tersimpan.');
  }
}
function updateDbStatusBadge(){
  const el = document.getElementById('db-status');
  if(!el) return;
  if(dbStatus==='online'){ el.textContent='🟢 Online'; el.title='Tersambung ke database'; }
  else if(dbStatus==='offline'){ el.textContent='🔴 Offline'; el.title='Gagal tersambung ke database — cek internet'; }
  else { el.textContent='⏳ Menyambung...'; }
}
function subscribeRealtime(){
  DATASETS_DB.forEach(k=>{
    sb.channel('sync-'+k)
      .on('postgres_changes', {event:'*', schema:'public', table:k}, async ()=>{
        await loadAll();
        updateDbStatusBadge();
        const activeTag = document.activeElement ? document.activeElement.tagName : '';
        if(activeTag!=='INPUT' && activeTag!=='SELECT' && activeTag!=='TEXTAREA'){
          renderAll();
        }
      })
      .subscribe();
  });
}

function itemById(id){ return items.find(x=>x.id===id); }
function stokItem(itemId){
  let masuk=0, keluar=0;
  trx.filter(t=>t.itemId===itemId).forEach(t=>{ if(t.tipe==='masuk') masuk+=t.qty; else keluar+=t.qty; });
  return {masuk, keluar, sisa: masuk-keluar};
}

// -- Perkiraan Stok Habis (Reorder) — berdasarkan rata-rata pemakaian 30 hari terakhir.
// Diekstrak dari Laporan Periode supaya bisa dipakai bersama oleh Laporan dan Dashboard
// tanpa duplikasi logika. Rumus TIDAK berubah dari yang sudah berjalan di Laporan.
function hitungReorderData(){
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-30);
  const cutoffStr = cutoff.toISOString().slice(0,10);
  return items.map(it=>{
    const pakai30 = trx.filter(t=>t.itemId===it.id && t.tipe==='keluar' && t.tanggal>=cutoffStr).reduce((s,t)=>s+t.qty,0);
    const rataHarian = pakai30/30;
    const sisa = stokItem(it.id).sisa;
    const estimasiHari = rataHarian>0 ? sisa/rataHarian : null;
    return {it, rataHarian, sisa, estimasiHari};
  }).filter(d=>d.rataHarian>0).sort((a,b)=>(a.estimasiHari??999999)-(b.estimasiHari??999999));
}

// -- varian roti (hasil produksi bisa banyak varian dari satu premix) --
function semuaVarianNama(){
  const set = new Set();
  produksi.forEach(p=> (p.varianHasil||[]).forEach(v=> set.add(v.nama)));
  return Array.from(set).sort();
}
function stokVarianGudang(nama){
  const dihasilkan = produksi.reduce((s,p)=> s + (p.varianHasil||[]).filter(v=>v.nama===nama).reduce((ss,v)=>ss+v.jumlah,0), 0);
  const dikemas = packing.reduce((s,p)=> s + (p.varian||[]).filter(v=>v.nama===nama).reduce((ss,v)=>ss+v.jumlah,0), 0);
  return { dihasilkan, dikemas, sisa: dihasilkan - dikemas };
}
function stokVarianCabang(nama, cabang){
  const dikirim = packing.filter(p=>p.cabang===cabang).reduce((s,p)=> s + (p.varian||[]).filter(v=>v.nama===nama).reduce((ss,v)=>ss+v.jumlah,0), 0);
  const returPcs = retur.filter(r=>r.jenis==='roti' && r.varianNama===nama && r.cabang===cabang).reduce((s,r)=>s+(r.jumlah||0),0);
  return { dikirim, returPcs, efektif: dikirim-returPcs };
}
function returTotalNilai(jenis, dari, sampai){
  const inRange = (tgl)=> (!dari||tgl>=dari) && (!sampai||tgl<=sampai);
  return retur.filter(r=>r.jenis===jenis && inRange(r.tanggal)).reduce((s,r)=>s+(r.nilai||0),0);
}
function returTotalJumlahRoti(dari, sampai){
  const inRange = (tgl)=> (!dari||tgl>=dari) && (!sampai||tgl<=sampai);
  return retur.filter(r=>r.jenis==='roti' && inRange(r.tanggal)).reduce((s,r)=>s+(r.jumlah||0),0);
}

function cekSelisihProduksi(inp){
  const badge = document.querySelector(`[data-selisih-for="${CSS.escape(inp.dataset.nama)}"]`);
  if(!badge) return;
  const satHasil = inp.dataset.satuan || 'pcs';
  const val = inp.value===''? NaN : parseFloat(inp.value);
  if(isNaN(val)){ badge.textContent='-'; badge.className='selisih-badge'; return; }
  const min = parseFloat(inp.dataset.min)||0;
  const max = parseFloat(inp.dataset.max)||min;
  if(val < min){
    badge.textContent = '−'+(min-val).toLocaleString('id-ID')+' '+satHasil+' (kurang dari standar)';
    badge.className = 'selisih-badge sisa-low';
  } else if(val > max){
    badge.textContent = '+'+(val-max).toLocaleString('id-ID')+' '+satHasil+' (lebih dari standar)';
    badge.className = 'selisih-badge sisa-ok';
  } else {
    badge.textContent = 'Sesuai standar';
    badge.className = 'selisih-badge sisa-ok';
  }
}

function hitungTotalMasukPremix(){
  const qtyInput = document.getElementById('trx-qty-input');
  const note = document.getElementById('masuk-total-premix-note');
  const it = masukSelectedItemId ? itemById(masukSelectedItemId) : null;
  if(!it || !qtyInput) return;
  const resepList = it.resepList||[];
  let totalR=0, totalKg=0, semuaAdaKg=true, ada=false;
  document.querySelectorAll('.masuk-resep-count-input').forEach(inp=>{
    const count = parseFloat(inp.value)||0;
    if(count>0){
      ada = true;
      const r = resepList.find(x=>x.id===inp.dataset.resepId);
      if(r){
        totalR += r.resepQty*count;
        if(r.premixKg>0) totalKg += r.premixKg*count; else semuaAdaKg=false;
      }
    }
  });
  const totalQty = semuaAdaKg && ada ? totalKg : totalR;
  qtyInput.value = ada ? (Math.round(totalQty*1000)/1000) : '';
  if(note) note.textContent = `Total: ${totalQty.toLocaleString('id-ID',{maximumFractionDigits:3})} ${it.satuan} (${totalR.toLocaleString('id-ID',{maximumFractionDigits:2})} r)`
    + (ada && !semuaAdaKg ? ' — sebagian ukuran belum ada acuan kg di tab Kode, dipakai jumlah r langsung' : '');
}
async function tambahTrx(t){ const rec={id:uid(), ...t}; trx.push(rec); await save('trx', trx); return rec; }

// ============================================================
// RIWAYAT EDIT — log siapa/kapan/apa yang diubah tiap kali data
// hasil input (bukan baru ditambah) diedit lewat tombol "Edit"
// ============================================================
async function catatEdit(dataset, refId, labelData, before, after){
  const perubahan = [];
  for(const k in after){
    if(k==='id') continue;
    const a = before ? before[k] : undefined;
    const b = after[k];
    if(JSON.stringify(a)!==JSON.stringify(b)) perubahan.push(`${k}: "${a??'-'}" → "${b??'-'}"`);
  }
  if(perubahan.length===0) return;
  riwayatEdit.push({ id:uid(), waktu:new Date().toISOString(), dataset, refId, labelData, perubahan });
  await save('riwayatEdit', riwayatEdit);
}
function riwayatEditUntuk(dataset, refId){
  return riwayatEdit.filter(r=>r.dataset===dataset && r.refId===refId).sort((a,b)=>b.waktu.localeCompare(a.waktu));
}
function renderRiwayatEditBox(dataset, refId){
  const list = riwayatEditUntuk(dataset, refId);
  if(list.length===0) return '';
  const rows = list.map(r=>`<li>${new Date(r.waktu).toLocaleString('id-ID')} — ${r.perubahan.join('; ')}</li>`).join('');
  return `<div class="note" style="margin-top:4px;"><b>Riwayat edit:</b><ul style="margin:4px 0 0 16px;padding:0;">${rows}</ul></div>`;
}

// ============================================================
// EXPORT / IMPORT EXCEL
// Tujuan: admin gudang input data di device dia lewat aplikasi
// ini seperti biasa, lalu klik "Export Excel" -> dapat file
// .xlsx berisi SEMUA data (items, trx, produksi, packing,
// penjualan, opname, retur). File itu dikirim (WA/email) ke
// device lain, lalu klik "Import Excel" -> data langsung masuk.
// Kolom yang isinya objek/array (misal resepList, varianHasil)
// otomatis disimpan sebagai teks JSON di dalam sel, dan saat
// import teks JSON itu diuraikan balik jadi objek/array.
// ============================================================
const DATASETS_EXCEL = DATASETS_DB;

function flattenRecordForExcel(rec){
  const out = {};
  for(const k in rec){
    const v = rec[k];
    out[k] = (v!==null && typeof v==='object') ? JSON.stringify(v) : v;
  }
  return out;
}
function unflattenRecordFromExcel(row){
  const out = {};
  for(const k in row){
    let v = row[k];
    if(typeof v==='string' && (v.startsWith('[')||v.startsWith('{'))){
      try{ v = JSON.parse(v); }catch(e){ /* biarkan sebagai teks kalau bukan JSON valid */ }
    }
    if(v===undefined) v='';
    out[k]=v;
  }
  return out;
}

function exportExcel(){
  const dataMap = {items, trx, produksi, packing, penjualan, opname, retur, riwayatEdit};
  const wb = XLSX.utils.book_new();
  DATASETS_EXCEL.forEach(name=>{
    const arr = dataMap[name] || [];
    const flat = arr.map(flattenRecordForExcel);
    const ws = XLSX.utils.json_to_sheet(flat.length ? flat : [{}]);
    XLSX.utils.book_append_sheet(wb, ws, name);
  });
  const namaFile = `gudang-roti-${today()}.xlsx`;
  XLSX.writeFile(wb, namaFile);
}

function importExcel(file){
  const status = document.getElementById('import-status');
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      const dataMap = {};
      DATASETS_EXCEL.forEach(name=>{
        if(!wb.SheetNames.includes(name)) return;
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {defval:''});
        const parsed = rows
          .map(unflattenRecordFromExcel)
          .filter(r=> r.id); // baris kosong dari sheet template dibuang
        dataMap[name] = parsed;
      });
      if(Object.keys(dataMap).length===0){
        if(status) status.textContent = 'File tidak dikenali (bukan hasil Export Excel dari aplikasi ini).';
        return;
      }
      if(!confirm('Data yang ada sekarang akan DIGANTI dengan isi file ini. Lanjutkan?')) return;
      for(const name of DATASETS_EXCEL){
        if(!(name in dataMap)) continue;
        window[name].length = 0;
        window[name].push(...dataMap[name]);
        await save(name, window[name]);
      }
      items=window.items; trx=window.trx; produksi=window.produksi; packing=window.packing;
      penjualan=window.penjualan; opname=window.opname; retur=window.retur; riwayatEdit=window.riwayatEdit||[];
      if(status) status.textContent = 'Data berhasil diimpor.';
      renderAll();
    }catch(err){
      console.error(err);
      if(status) status.textContent = 'Gagal membaca file Excel.';
    }
  };
  reader.readAsArrayBuffer(file);
}

function lastDayOfMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function fmtD(d){ return d.toISOString().slice(0,10); }
function jadwalOpnameBerikutnya(){
  const now = new Date(); now.setHours(0,0,0,0);
  const y = now.getFullYear(), m = now.getMonth(), tgl = now.getDate();

  let d20 = new Date(y,m,20);
  if(tgl>20) d20 = new Date(y,m+1,20);

  const lastThis = lastDayOfMonth(y,m);
  let dAkhir = new Date(y,m,lastThis);
  if(tgl>=lastThis) dAkhir = new Date(y,m+1, lastDayOfMonth(y,m+1));

  const mingguanList = opname.filter(o=>o.jenis==='Mingguan').sort((a,b)=>b.tanggal.localeCompare(a.tanggal));
  let dMinggu;
  if(mingguanList.length>0){
    const last = new Date(mingguanList[0].tanggal);
    dMinggu = new Date(last.getTime());
    dMinggu.setDate(dMinggu.getDate()+7);
    while(dMinggu < now){ dMinggu.setDate(dMinggu.getDate()+7); }
  } else {
    dMinggu = new Date(now.getTime()); dMinggu.setDate(dMinggu.getDate()+7);
  }

  return { mingguan: fmtD(dMinggu), tgl20: fmtD(d20), akhirBulan: fmtD(dAkhir) };
}
function jenisOtomatis(tanggalStr){
  const d = new Date(tanggalStr);
  const y=d.getFullYear(), m=d.getMonth(), tgl=d.getDate();
  if(tgl===lastDayOfMonth(y,m)) return 'Akhir Bulan';
  if(tgl===20) return 'Tanggal 20';
  return 'Mingguan';
}

// ================= INTERNAL CONTROL — perhitungan terpusat (Tahap 9) =================
// Dipakai bersama oleh Dashboard dan Laporan > Ringkasan Manajemen, supaya angka yang
// ditampilkan di kedua tempat selalu konsisten (satu sumber perhitungan, bukan dihitung ulang
// terpisah-pisah). Tidak ada mekanisme stok baru di sini — semua tetap dibaca dari stokItem(),
// trx, opname, produksi, packing yang sudah ada.
function hitungInternalControlSnapshot(dari, sampai){
  const inRange = (tgl)=> (!dari||tgl>=dari) && (!sampai||tgl<=sampai);

  // -- A. Ringkasan Stok (snapshot saat ini, tidak terikat periode) --
  let totalNilaiStok=0, jumlahMinus=0;
  const nilaiPerKategori = {}; Object.keys(KATEGORI).forEach(k=> nilaiPerKategori[k]=0);
  items.forEach(it=>{
    const s = stokItem(it.id).sisa;
    const nilai = s*it.harga;
    totalNilaiStok += nilai;
    if(s<0) jumlahMinus++;
    if(nilaiPerKategori[it.kategori]!=null) nilaiPerKategori[it.kategori]+=nilai;
  });
  const reorderData = hitungReorderData();
  const hampirHabis = reorderData.filter(d=>d.estimasiHari!=null && d.estimasiHari<7);

  // -- B. Aktivitas Gudang (periode terpilih) --
  const trxR = trx.filter(t=>inRange(t.tanggal));
  const qtyMasuk = trxR.filter(t=>t.tipe==='masuk').reduce((s,t)=>s+t.qty,0);
  const nilaiMasuk = trxR.filter(t=>t.tipe==='masuk').reduce((s,t)=>{ const it=itemById(t.itemId); return s+(it?it.harga*t.qty:0); },0);
  const qtyKeluar = trxR.filter(t=>t.tipe==='keluar').reduce((s,t)=>s+t.qty,0);
  const nilaiKeluar = trxR.filter(t=>t.tipe==='keluar').reduce((s,t)=>{ const it=itemById(t.itemId); return s+(it?it.harga*t.qty:0); },0);
  const produksiR = produksi.filter(p=>inRange(p.tanggal));
  const totalProduksi = produksiR.reduce((s,p)=>s+(p.totalHasil||0),0);
  const packingR = packing.filter(p=>inRange(p.tanggal));
  const totalPacking = packingR.reduce((s,p)=>s+(p.varian||[]).reduce((ss,v)=>ss+v.jumlah,0),0);

  // -- C. Stock Opname (periode terpilih) — sumber data sama dengan Laporan Selisih Stok --
  const opnameR = opname.filter(o=>inRange(o.tanggal));
  let jumlahBarangSelisih=0, nilaiSelisihPos=0, nilaiSelisihNeg=0, sudahAdjustment=0, belumAdjustment=0;
  opnameR.forEach(o=>{
    (o.entries||[]).forEach(e=>{
      if(e.selisih===0) return;
      jumlahBarangSelisih++;
      const it = itemById(e.itemId);
      const nilai = it? e.selisih*it.harga : 0;
      if(nilai>=0) nilaiSelisihPos+=nilai; else nilaiSelisihNeg+=nilai;
      if(o.diterapkan) sudahAdjustment++; else belumAdjustment++;
    });
  });
  const nilaiTotalSelisih = nilaiSelisihPos+nilaiSelisihNeg;

  // -- D. Audit Integritas Data & Alert Internal Control — TIDAK dibatasi periode, karena ini
  // soal validitas data yang sedang berjalan (bukan sekadar rekap periode) --
  let bermasalahAdjustment = 0;
  const opnameBelumAdjustmentAllTime = opname.filter(o=>!o.diterapkan && (o.entries||[]).some(e=>e.selisih!==0)).length;
  const adjustmentTrxIdSet = new Set();
  opname.forEach(o=>{
    (o.entries||[]).forEach(e=>{
      if(e.selisih===0) return;
      const a = auditAdjustmentEntry(o, e);
      if(a.label.startsWith('⚠')) bermasalahAdjustment++;
      if(e.trxId) adjustmentTrxIdSet.add(e.trxId);
    });
  });
  // -- deteksi transaksi duplikat persis (itemId+tipe+qty+tanggal+ket) — indikasi salah input ganda --
  const trxKeyCount = {};
  trx.forEach(t=>{ const key = [t.itemId,t.tipe,t.qty,t.tanggal,t.ket||''].join('|'); trxKeyCount[key]=(trxKeyCount[key]||0)+1; });
  const jumlahTrxDuplikat = Object.values(trxKeyCount).filter(c=>c>1).length;
  // -- validitas transaksi: transaksi yang datanya sendiri tidak wajar (bukan soal stok) --
  const trxOrphanItem = trx.filter(t=> !itemById(t.itemId));
  const trxTidakValid = trx.filter(t=> !(t.qty>0) || !t.tanggal || !['masuk','keluar'].includes(t.tipe));
  // -- adjustment "yatim": trx berketerangan Penyesuaian Opname tapi tidak ada satupun
  // opname.entries[].trxId yang menunjuknya — indikasi dibuat di luar alur Sesuaikan Stok,
  // atau sisa dari opname yang pernah dihapus/diedit di luar jalur normal --
  const trxAdjustmentYatim = trx.filter(t=> t.ket && t.ket.startsWith('Penyesuaian Opname') && !adjustmentTrxIdSet.has(t.id));

  const alerts = [];
  if(jumlahMinus>0) alerts.push({level:'red', text:`${jumlahMinus} barang stok minus (sisa di bawah 0) — segera cek Arus/Kode.`});
  if(hampirHabis.length>0) alerts.push({level:'amber', text:`${hampirHabis.length} barang diperkirakan habis dalam <7 hari (berdasarkan rata pemakaian 30 hari terakhir).`});
  if(opnameBelumAdjustmentAllTime>0) alerts.push({level:'amber', text:`${opnameBelumAdjustmentAllTime} sesi opname punya selisih tapi belum "Sesuaikan Stok" — buka tab Opname.`});
  if(bermasalahAdjustment>0) alerts.push({level:'red', text:`${bermasalahAdjustment} adjustment opname bermasalah — trxId tercatat tapi transaksinya sudah tidak ada di data Masuk/Keluar. Cek Laporan Selisih Stok.`});
  if(jumlahTrxDuplikat>0) alerts.push({level:'amber', text:`${jumlahTrxDuplikat} pola transaksi (barang, tipe, qty, tanggal, keterangan) tercatat lebih dari sekali — cek kemungkinan input ganda di tab Arus.`});
  if(trxOrphanItem.length>0) alerts.push({level:'red', text:`${trxOrphanItem.length} transaksi Masuk/Keluar mengacu ke barang yang sudah dihapus dari Kode — transaksi ini tidak lagi terhitung di stok manapun.`});
  if(trxTidakValid.length>0) alerts.push({level:'red', text:`${trxTidakValid.length} transaksi Masuk/Keluar punya data tidak wajar (qty nol/negatif, tanggal kosong, atau tipe tidak dikenal).`});
  if(trxAdjustmentYatim.length>0) alerts.push({level:'amber', text:`${trxAdjustmentYatim.length} transaksi berketerangan "Penyesuaian Opname" tidak terhubung ke sesi Opname manapun — cek apakah ini sisa dari opname yang pernah dihapus/diedit di luar alur normal.`});
  if(alerts.length===0) alerts.push({level:'green', text:'Tidak ada indikasi masalah saat ini. Semua stok, opname, dan adjustment terpantau normal.'});

  return {
    dari, sampai,
    totalNilaiStok, jumlahMinus, nilaiPerKategori, reorderData, hampirHabis,
    trxR, qtyMasuk, nilaiMasuk, qtyKeluar, nilaiKeluar,
    produksiR, totalProduksi, packingR, totalPacking,
    opnameR, jumlahBarangSelisih, nilaiSelisihPos, nilaiSelisihNeg, nilaiTotalSelisih, sudahAdjustment, belumAdjustment,
    bermasalahAdjustment, opnameBelumAdjustmentAllTime, jumlahTrxDuplikat,
    trxOrphanItem, trxTidakValid, trxAdjustmentYatim,
    alerts
  };
}

function hitungDashboard(dari, sampai){
  const d = hitungInternalControlSnapshot(dari, sampai);
  const {
    totalNilaiStok, jumlahMinus, nilaiPerKategori, hampirHabis,

    <tbody>${kategoriStokRows}</tbody></table>
  </div>
  <div class="card">
    <h2>B. Aktivitas Gudang (${dari||'awal'} s/d ${sampai||'sekarang'})</h2>
    <div class="grid">
      <div class="stat"><div class="label">Stok Masuk</div><div class="value">${qtyMasuk.toLocaleString('id-ID')}</div><div class="sub" style="margin:2px 0 0 0;">${rupiah(nilaiMasuk)}</div></div>
      <div class="stat"><div class="label">Stok Keluar</div><div class="value">${qtyKeluar.toLocaleString('id-ID')}</div><div class="sub" style="margin:2px 0 0 0;">${rupiah(nilaiKeluar)}</div></div>
      <div class="stat"><div class="label">Hasil Produksi</div><div class="value">${totalProduksi.toLocaleString('id-ID')} pcs</div></div>
      <div class="stat"><div class="label">Hasil Packing</div><div class="value">${totalPacking.toLocaleString('id-ID')} pcs</div></div>
    </div>
  </div>
  <div class="card">
    <h2>C. Stock Opname (${dari||'awal'} s/d ${sampai||'sekarang'})</h2>
    <div class="grid">
      <div class="stat"><div class="label">Jumlah Opname</div><div class="value">${opnameR.length}</div></div>
      <div class="stat"><div class="label">Barang Selisih</div><div class="value">${jumlahBarangSelisih}</div></div>

      <div class="stat pos"><div class="label">Nilai Selisih Positif</div><div class="value">${rupiah(nilaiSelisihPos)}</div></div>
      <div class="stat neg"><div class="label">Nilai Selisih Negatif</div><div class="value">${rupiah(Math.abs(nilaiSelisihNeg))}</div></div>
      <div class="stat"><div class="label">Sudah Adjustment</div><div class="value">${sudahAdjustment}</div></div>
      <div class="stat"><div class="label">Belum Adjustment</div><div class="value">${belumAdjustment}</div></div>
    </div>
  </div>
  <div class="card">
    <h2>D. Alert Internal Control</h2>
    <div class="sub">Perlu Tindakan = masalah nyata pada data. Perhatian = perlu dicek tapi belum tentu masalah. Normal = aman.</div>
    ${alertRows}
  </div>
  `;
}

    const tempRows = tempResepVarian.map((v,idx)=>`<tr>

    <h2>Tambah Kode Barang</h2>

    <form class="inline" id="form-item">

          <option value="kardus">Kardus</option>
        </select>
      </div>
      <div class="field"><label>Nama Barang</label><input name="nama" required placeholder="cth: Premix Chiffon"></div>
      <div class="field"><label>Satuan</label><input name="satuan" required placeholder="kg / resep / lusin"></div>
      <div class="field"><label>Harga per Satuan (Rp)</label><input name="harga" type="number" required min="0"></div>
      <div id="premix-only-fields" style="display:flex; gap:8px; flex-wrap:wrap;">
        <div class="field"><label>Jenis Perhitungan</label><select name="jenisHitung">${jenisHitungOptions('mix')}</select></div>
        <div class="field"><label>Satuan Hasil</label><select name="satuanHasil">${satuanHasilOptions('pcs')}</select></div>

  </div>`;

  return `
  ${itemFormHtml}
  <div class="card">
    <h2>Daftar Kode Barang (${items.length})</h2>

    <tbody>${rows || '<tr><td colspan="10" class="empty">Belum ada barang, tambahkan di atas</td></tr>'}</tbody></table>
  </div>

    <form class="inline"><div class="field" style="min-width:260px;"><label>Premix</label><select id="resep-item-select"><option value="">-- pilih --</option>${premixOptions}</select></div></form>`}
  </div>
  ${resepBuilderHtml}
  `;
}

function viewTransaksi(tipe){
  const label = tipe==='masuk' ? 'Stok Masuk (Pembelian)' : 'Stok Keluar (Pemakaian Manual)';
  const itemsUntukForm = tipe==='keluar' ? items.filter(i=>i.kategori==='bahan') : items;
  if(tipe==='masuk' && !masukSelectedItemId && itemsUntukForm.length>0) masukSelectedItemId = itemsUntukForm[0].id;
  const options = itemsUntukForm.map(it=>`<option value="${it.id}" ${tipe==='masuk'&&it.id===masukSelectedItemId?'selected':''}>${it.kode} - ${it.nama} (${it.satuan})</option>`).join('');
  const supplierOptions = SUPPLIERS.map(s=>`<option value="${s}">${s}</option>`).join('');

  // -- Masuk: kalau barang yang dipilih adalah Premix yang sudah punya beberapa ukuran resep
  // (misal 1R, 3R, 5R), tampilkan pilihan supaya bisa dicatat sekaligus (anak produksi biasanya
  // ambil beberapa ukuran sekaligus, misal 5R x1 + 3R x1 + 1R x2) dan totalnya dihitung otomatis.
  const masukItem = (tipe==='masuk' && masukSelectedItemId) ? itemById(masukSelectedItemId) : null;
  const masukResepList = (masukItem && masukItem.kategori==='premix') ? (masukItem.resepList||[]) : [];
  let masukMultiHtml = '';
  if(tipe==='masuk' && masukResepList.length>0){
    const resepRows = masukResepList.slice().sort((a,b)=>a.resepQty-b.resepQty).map(r=>{
      const kgTxt = r.premixKg>0 ? ` = ${r.premixKg} ${masukItem.satuan}` : ' (belum ada acuan kg)';
      const varianTxt = (r.varian||[]).map(v=>v.nama).join(', ') || 'belum ada varian';
      return `<div class="field"><label>${r.resepQty}R${kgTxt}<br><span style="font-weight:400;font-size:10.5px;color:var(--brown-soft);">${varianTxt}</span></label><input type="number" min="0" step="any" class="masuk-resep-count-input" data-resep-id="${r.id}" placeholder="0x" oninput="hitungTotalMasukPremix();"></div>`;
    }).join('');
    masukMultiHtml = `
    <div class="card" style="background:var(--cream);margin-bottom:10px;">
      <h2 style="font-size:13px;">Pilih Ukuran Premix "${masukItem.nama}" yang Diterima</h2>
      <div class="sub">Isi berapa kali tiap ukuran diterima (misal 5R x1, 3R x1, 1R x2) — total ${masukItem.satuan} yang masuk ke stok dihitung otomatis di kolom Jumlah bawah. <b>Pakai ini HANYA kalau kode barang "${masukItem.nama}" ini memang satu stok yang sama untuk semua ukuran</b> (misal premix curah yang dikemas ulang). Kalau tiap ukuran kemasan sebenarnya beda fisik/beda kode barang, pakai form "Catat Beberapa Barang Sekaligus" di bawah supaya stok tiap ukuran tidak kecampur.</div>
      <form class="inline">${resepRows}</form>
      <div class="note" id="masuk-total-premix-note">Total: 0 ${masukItem.satuan} (0 r)</div>
    </div>`;
  }

  // -- Masuk: catat BEBERAPA KODE BARANG BERBEDA sekaligus (misal Manis 1R + 3R + 5R, tiap ukuran
  // sudah jadi kode barang terpisah di tab Kode) — supaya stok & stock opname tiap ukuran tetap
  // rapi terpisah, tidak ketuker/kecampur jadi satu angka gabungan.
  let masukBanyakBarangHtml = '';
  if(tipe==='masuk'){
    const rowsHtml = masukMultiRows.map((r,idx)=>{
      const itOpts = items.map(it=>`<option value="${it.id}" ${it.id===r.itemId?'selected':''}>${it.kode} - ${it.nama} (${it.satuan})</option>`).join('');
      return `<tr>
      <td><select class="masuk-multi-item" data-idx="${idx}"><option value="">-- pilih barang --</option>${itOpts}</select></td>
      <td><input type="number" step="any" min="0" class="masuk-multi-qty" data-idx="${idx}" value="${r.qty}" placeholder="jumlah" style="width:90px;"></td>
      <td><input type="text" class="masuk-multi-ket" data-idx="${idx}" value="${r.ket}" placeholder="opsional" style="width:120px;"></td>
      <td>${masukMultiRows.length>1?`<button type="button" class="danger" data-del-masuk-multi-row="${idx}">Hapus</button>`:''}</td>
    </tr>`;
    }).join('');
    masukBanyakBarangHtml = `
    <div class="card">
      <h2>Catat Beberapa Barang Sekaligus</h2>
      <div class="sub">Untuk kondisi kemasan beda-beda per ukuran (misal Premix Manis 1R, 3R, 5R = 3 kode barang terpisah di tab Kode). Isi sampai 4 baris sekaligus, tiap baris stoknya bertambah sendiri-sendiri sesuai kode barangnya — tidak digabung jadi satu angka, supaya pas stock opname jelas sisa tiap ukuran berapa.</div>
      <div class="inline" style="margin-bottom:8px;">
        <div class="field"><label>Tanggal</label><input type="date" id="masuk-multi-tanggal" value="${today()}"></div>
        <div class="field"><label>CV / Supplier</label><select id="masuk-multi-supplier">${supplierOptions}</select></div>
      </div>
      <table><thead><tr><th>Barang</th><th>Jumlah</th><th>Keterangan</th><th></th></tr></thead>
      <tbody id="masuk-multi-tbody">${rowsHtml}</tbody></table>
      <div style="margin-top:8px;">
        <button type="button" class="primary" id="btn-tambah-baris-masuk-multi" ${masukMultiRows.length>=4?'disabled':''}>+ Tambah Baris</button>
        <button type="button" class="primary" id="btn-simpan-masuk-multi">Simpan Semua Baris</button>
      </div>
    </div>`;
  }

  const f = filterTrx[tipe];
  const kategoriOptions = Object.keys(KATEGORI).map(k=>`<option value="${k}" ${f.kategori===k?'selected':''}>${KATEGORI[k].label}</option>`).join('');

  let list = trx.filter(t=>t.tipe===tipe);
  if(f.kategori) list = list.filter(t=>{ const it=itemById(t.itemId); return it && it.kategori===f.kategori; });
  if(f.dari) list = list.filter(t=>t.tanggal>=f.dari);
  if(f.sampai) list = list.filter(t=>t.tanggal<=f.sampai);
  list = list.slice().sort((a,b)=>b.tanggal.localeCompare(a.tanggal));

  const rows = list.map((t,idx)=>{
    const it = itemById(t.itemId); if(!it) return '';
    const nilai = it.harga*t.qty;
    const isEditing = editingRow && editingRow.dataset==='trx' && editingRow.id===t.id;
    if(isEditing){
      return `<tr data-edit-row="trx-${t.id}">
        <td>${idx+1}</td>
        <td><span class="kode-badge">${it.kode}</span></td>
        <td>${it.nama}</td>
        ${tipe==='masuk' ? `<td><select class="edit-supplier">${SUPPLIERS.map(s=>`<option ${s===t.supplier?'selected':''}>${s}</option>`).join('')}</select></td>` : ''}
        <td><input type="number" step="any" min="0" class="edit-qty" value="${t.qty}" style="width:90px;"></td>
        <td>${rupiah(nilai)}</td>
        <td><input type="text" class="edit-ket" value="${t.ket||''}" style="width:120px;"></td>
        <td><input type="date" class="edit-tanggal" value="${t.tanggal}" style="width:130px;"></td>
        <td>
          <button class="primary" data-save-edit-trx="${t.id}" style="padding:5px 10px;">Simpan</button>
          <button class="danger" data-batal-edit>Batal</button>
        </td>
      </tr>`;
    }
    return `<tr>
      <td>${idx+1}</td>
      <td><span class="kode-badge">${it.kode}</span></td>
      <td>${it.nama}</td>
      ${tipe==='masuk' ? `<td>${t.supplier||'-'}</td>` : ''}
      <td>${t.qty.toLocaleString('id-ID')} ${it.satuan}</td>
      <td>${rupiah(nilai)}</td>
      <td>${t.ket||'-'}</td>
      <td>${t.tanggal}</td>
      <td>
        <button class="danger" style="color:var(--blue)" data-edit-trx="${t.id}">Edit</button>
        <button class="danger" data-del-trx="${t.id}">Hapus</button>
      </td>
    </tr>${renderRiwayatEditBoxRow(riwayatEditUntuk('trx', t.id))}`;
  }).join('');

  return `
  ${tipe==='masuk' ? masukBanyakBarangHtml : ''}
  <div class="card">
    <h2>${label}${tipe==='masuk'?' — Barang Tunggal':''}</h2>
    ${tipe==='keluar' ? `<div class="note">Premix keluar dicatat lewat tab <b>Produksi</b>, kardus &amp; bahan pembungkus (misal OPP) yang dipakai packing dicatat lewat tab <b>Packing</b>, dan retur dicatat lewat tab <b>Retur</b> — supaya stoknya tidak berkurang dobel. Tab ini khusus untuk pemakaian Bahan Baku DI LUAR packing/produksi (misal rusak/hilang/dipakai lain).</div>` : ''}
    ${itemsUntukForm.length===0 ? `<div class="empty">${tipe==='keluar' ? 'Belum ada Bahan Baku terdaftar di tab Kode' : 'Tambahkan barang dulu di tab Kode'}</div>` : `
    ${masukMultiHtml}
    <form class="inline" id="form-trx" data-tipe="${tipe}" style="margin-top:10px;">
      <div class="field"><label>Tanggal</label><input name="tanggal" type="date" value="${today()}" required></div>
      <div class="field"><label>Barang</label><select name="itemId" id="trx-item-select" required>${options}</select></div>
      ${tipe==='masuk' ? `<div class="field"><label>CV / Supplier</label><select name="supplier" required>${supplierOptions}</select></div>` : ''}
      <div class="field"><label>Jumlah${masukResepList.length>0?' (otomatis)':''}</label><input name="qty" id="trx-qty-input" type="number" step="any" min="0" ${masukResepList.length>0?'readonly':''} required></div>
      <div class="field"><label>Keterangan</label><input name="ket" placeholder="opsional"></div>
      <button class="primary" type="submit">Simpan</button>
    </form>`}
  </div>
  <div class="card">
    <h2>Filter Riwayat</h2>
    <form class="inline" id="form-filter-trx" data-tipe="${tipe}">
      <div class="field"><label>Kategori</label><select name="kategori"><option value="">Semua</option>${kategoriOptions}</select></div>
      <div class="field"><label>Dari Tanggal</label><input type="date" name="dari" value="${f.dari}"></div>
      <div class="field"><label>Sampai Tanggal</label><input type="date" name="sampai" value="${f.sampai}"></div>
      <button class="primary" type="submit">Terapkan Filter</button>
      <button class="danger" type="button" id="btn-reset-filter-trx">Reset</button>
    </form>
  </div>
  <div class="card">
    <h2>Riwayat ${label} (${list.length}${list.length!==trx.filter(t=>t.tipe===tipe).length ? ' dari '+trx.filter(t=>t.tipe===tipe).length : ''})</h2>
    <table><thead><tr><th>No</th><th>Kode</th><th>Barang</th>${tipe==='masuk'?'<th>CV/Supplier</th>':''}<th>Jumlah</th><th>Nilai</th><th>Ket</th><th>Tanggal</th><th></th></tr></thead>
    <tbody>${rows || `<tr><td colspan="${tipe==='masuk'?9:8}" class="empty">Tidak ada transaksi sesuai filter</td></tr>`}</tbody></table>
  </div>
  `;
}
function renderRiwayatEditBoxRow(list){
  if(!list || list.length===0) return '';
  const rows = list.map(r=>`<li>${new Date(r.waktu).toLocaleString('id-ID')} — ${r.perubahan.join('; ')}</li>`).join('');
  return `<tr><td colspan="9"><div class="note"><b>Riwayat edit:</b><ul style="margin:4px 0 0 16px;padding:0;">${rows}</ul></div></td></tr>`;
}

function viewArus(){
  const varianNama = semuaVarianNama();
  const rotiRows = varianNama.map(nama=>{
    const s = stokVarianGudang(nama);
    return `<tr>
      <td>${nama}</td>
      <td>${s.dihasilkan.toLocaleString('id-ID')} pcs</td>
      <td>${s.dikemas.toLocaleString('id-ID')} pcs</td>
      <td class="${s.sisa<0?'sisa-low':'sisa-ok'}">${s.sisa.toLocaleString('id-ID')} pcs</td>
    </tr>`;
  }).join('');

  const cabangHeader = TUJUAN_PACKING.map(c=>`<th>${c}</th>`).join('');
  const cabangRows = varianNama.map(nama=>{
    const cells = TUJUAN_PACKING.map(c=>{
      const s = stokVarianCabang(nama, c);
      return `<td>${s.efektif.toLocaleString('id-ID')}${s.returPcs>0?` <span class="sisa-low">(-${s.returPcs} retur)</span>`:''}</td>`;
    }).join('');
    return `<tr><td>${nama}</td>${cells}</tr>`;
  }).join('');

  const rows = items.map((it,idx)=>{
    const s = stokItem(it.id);
    const nilaiSisa = s.sisa*it.harga;
    return `<tr>
      <td>${idx+1}</td>
      <td><span class="kode-badge">${it.kode}</span></td>
      <td><span class="tag ${it.kategori}">${KATEGORI[it.kategori].label}</span></td>
      <td>${it.nama}</td>
      <td>${s.masuk.toLocaleString('id-ID')} ${it.satuan}</td>
      <td>${s.keluar.toLocaleString('id-ID')} ${it.satuan}</td>
      <td class="${s.sisa<0?'sisa-low':'sisa-ok'}">${s.sisa.toLocaleString('id-ID')} ${it.satuan}</td>
      <td>${rupiah(nilaiSisa)}</td>
    </tr>`;
  }).join('');

  const totalNilaiSisa = items.reduce((sum,it)=> sum + stokItem(it.id).sisa*it.harga, 0);
  const minus = items.filter(it=>stokItem(it.id).sisa<0).length;

  return `
  <div class="card">
    <h2>Stok Roti Jadi di Gudang (Belum Dikemas)</h2>
    <div class="sub">Hasil Produksi dikurangi yang sudah dikemas per varian — bukan bahan baku, tapi produk jadi. Satu premix bisa menghasilkan beberapa varian sekaligus.</div>
    <table><thead><tr><th>Varian Roti</th><th>Total Dihasilkan</th><th>Sudah Dikemas</th><th>Sisa Belum Dikemas</th></tr></thead>
    <tbody>${rotiRows || '<tr><td colspan="4" class="empty">Belum ada produksi</td></tr>'}</tbody></table>
  </div>
  <div class="card">
    <h2>Stok Roti Terkirim per Cabang / Stock Toko (setelah Retur)</h2>
    <div class="sub">Jumlah yang sudah dipacking ke tiap cabang atau Stock Toko, dikurangi retur roti dari tujuan tsb</div>
    <table><thead><tr><th>Varian Roti</th>${cabangHeader}</tr></thead>
    <tbody>${cabangRows || `<tr><td colspan="${TUJUAN_PACKING.length+1}" class="empty">Belum ada packing</td></tr>`}</tbody></table>
  </div>
  <div class="card">
    <h2>Arus Stok — Total Masuk, Keluar &amp; Sisa per Barang</h2>
    <div class="sub">Ini kartu stok otomatis: Sisa Stok = Total Masuk − Total Keluar (retur premix sudah ikut mengurangi lewat transaksi keluar)</div>
    <div class="grid">
      <div class="stat"><div class="label">Total Nilai Sisa Stok</div><div class="value">${rupiah(totalNilaiSisa)}</div></div>
      <div class="stat ${minus>0?'neg':'pos'}"><div class="label">Barang Minus Stok</div><div class="value">${minus}</div></div>
    </div>
    <table><thead><tr><th>No</th><th>Kode</th><th>Kategori</th><th>Nama</th><th>Total Masuk</th><th>Total Keluar</th><th>Sisa Stok</th><th>Nilai Sisa</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="8" class="empty">Belum ada barang</td></tr>'}</tbody></table>
  </div>
  `;
}

function viewOpname(){
  const jadwal = jadwalOpnameBerikutnya();
  const itemRows = items.map((it,idx)=>{
    const s = stokItem(it.id).sisa;
    return `<tr>
      <td>${idx+1}</td>
      <td><span class="kode-badge">${it.kode}</span></td>
      <td>${it.nama}</td>
      <td>${s.toLocaleString('id-ID')} ${it.satuan}</td>
      <td><input type="number" step="any" class="opname-fisik" data-item="${it.id}" data-satuan="${it.satuan}" data-sistem="${s}" placeholder="${s}"></td>
      <td><input type="text" class="opname-alasan" data-item="${it.id}" placeholder="opsional, cth: rusak/basi/salah hitung"></td>
    </tr>`;
  }).join('');

  const histRows = opname.slice().sort((a,b)=>b.tanggal.localeCompare(a.tanggal)).map((o,idx)=>{
    const totalSelisihNilai = o.entries.reduce((s,e)=>{ const it=itemById(e.itemId); return s + (it? e.selisih*it.harga : 0); },0);
    const bedaEntries = o.entries.filter(e=>e.selisih!==0);
    const detailRows = bedaEntries.map(e=>{
      const it = itemById(e.itemId);
      const satuan = it ? it.satuan : '';
      return `<li>${o.tanggal} — <b>${it?it.nama:'(barang dihapus)'}</b>: Sistem ${e.stokSistem.toLocaleString('id-ID')} ${satuan} → Fisik ${e.stokFisik.toLocaleString('id-ID')} ${satuan}, Selisih <span class="${e.selisih<0?'sisa-low':'sisa-ok'}">${e.selisih>0?'+':''}${e.selisih.toLocaleString('id-ID')} ${satuan}</span>${e.alasan?` — Alasan: ${e.alasan}`:''}</li>`;
    }).join('');
    const detailRow = bedaEntries.length>0 ? `<tr><td colspan="7"><div class="note"><b>Rincian barang beda (adjustment):</b><ul style="margin:4px 0 0 16px;padding:0;">${detailRows}</ul></div></td></tr>` : '';
    return `<tr>
      <td>${idx+1}</td>
      <td>${o.tanggal}</td>
      <td>${o.jenis}</td>
      <td>${bedaEntries.length} dari ${o.entries.length} beda</td>
      <td class="${totalSelisihNilai<0?'sisa-low':'sisa-ok'}">${rupiah(totalSelisihNilai)}</td>
      <td>${o.diterapkan ? 'Sudah disesuaikan' : `<button class="danger" style="color:var(--teal)" data-terapkan-opname="${o.id}">Sesuaikan Stok</button>`}</td>
      <td><button class="danger" data-del-opname="${o.id}">Hapus</button></td>
    </tr>${detailRow}`;
  }).join('');

  return `
  <div class="card">
    <h2>Jadwal Opname</h2>
    <div class="grid">
      <div class="stat"><div class="label">Mingguan Berikutnya</div><div class="value">${jadwal.mingguan}</div></div>
      <div class="stat"><div class="label">Tanggal 20 Berikutnya</div><div class="value">${jadwal.tgl20}</div></div>
      <div class="stat"><div class="label">Akhir Bulan Berikutnya</div><div class="value">${jadwal.akhirBulan}</div></div>
    </div>
  </div>
  <div class="card">
    <h2>Input Stock Opname</h2>
    <div class="sub">Isi stok fisik hasil hitung langsung di gudang. Kosongkan kalau sama dengan stok sistem. Alasan opsional tapi disarankan diisi untuk barang yang selisih, supaya riwayat adjustment jelas sumbernya.</div>
    ${items.length===0 ? '<div class="empty">Tambahkan barang dulu di tab Kode</div>' : `
    <form id="form-opname">
      <div class="inline" style="margin-bottom:10px;">
        <div class="field"><label>Tanggal Opname</label><input type="date" id="opname-tanggal" value="${today()}" required></div>

}

function standarProfilTotal(profil){
  if(profil.standarTotal!=null && profil.standarTotal!=='') return Number(profil.standarTotal)||0;
  return (profil.varian||[]).reduce((s,v)=>{
    const max = (v.max!=null && v.max!=='') ? v.max : v.min;
    return s + (Number(v.min)+Number(max))/2;
  }, 0);
}

// Baca semua ukuran resep (1R/3R/5R dst) yang diisi jumlah pemakaiannya (>0) di form Produksi
function getProduksiSelectedProfiles(){
  const it = produksiSelectedItemId ? itemById(produksiSelectedItemId) : null;
  if(!it) return [];
  const resepList = it.resepList||[];
  const result = [];
  document.querySelectorAll('.produksi-resep-count-input').forEach(inp=>{
    const count = parseFloat(inp.value)||0;
    if(count>0){
      const r = resepList.find(x=>x.id===inp.dataset.resepId);
      if(r) result.push({resep:r, count});
    }
  });
  return result;
}
// Gabungkan rentang acuan (min-max) varian roti sesuai kombinasi ukuran resep yang sedang diisi
function updateProduksiAcuanGabungan(){
  const profiles = getProduksiSelectedProfiles();
  const it = produksiSelectedItemId ? itemById(produksiSelectedItemId) : null;
  const satHasil = satuanHasilItem(it);
  document.querySelectorAll('#produksi-varian-tbody tr[data-varian-row]').forEach(tr=>{
    const nama = tr.dataset.varianRow;
    let minSum=0, maxSum=0, found=false;
    profiles.forEach(({resep,count})=>{
      const v = (resep.varian||[]).find(x=>x.nama===nama);
      if(v){ found=true; const vmax=(v.max!=null && v.max!=='') ? Number(v.max) : Number(v.min); minSum += Number(v.min)*count; maxSum += vmax*count; }
    });
    const acuanEl = tr.querySelector('[data-acuan-for]');
    const inputEl = tr.querySelector('.produksi-varian-input');
    if(found){
      acuanEl.textContent = (minSum===maxSum ? minSum.toLocaleString('id-ID') : minSum.toLocaleString('id-ID')+'-'+maxSum.toLocaleString('id-ID'))+' '+satHasil;
      inputEl.dataset.min = minSum; inputEl.dataset.max = maxSum;
    } else {
      acuanEl.textContent = '-';
      inputEl.dataset.min=''; inputEl.dataset.max='';
    }
  });
}
function updateProduksiMultiTotal(){
  const el = document.getElementById('produksi-multi-total');
  if(!el) return;
  const groups = {};
  let grand = 0;
  document.querySelectorAll('#produksi-multi-tbody tr').forEach(tr=>{
    const namaEl = tr.querySelector('.pm-hasilnama');
    const jumlahEl = tr.querySelector('.pm-hasiljumlah');
    if(!namaEl || !jumlahEl) return;
    const nama = (namaEl.value||'').trim();
    const jumlah = parseFloat(jumlahEl.value)||0;
    if(!nama || jumlah<=0) return;
    groups[nama] = (groups[nama]||0)+jumlah;
    grand += jumlah;
  });
  const keys = Object.keys(groups);
  if(keys.length===0){ el.innerHTML=''; return; }
  const rowsHtml = keys.map(k=>`<div class="stat"><div class="label">${k}</div><div class="value">${groups[k].toLocaleString('id-ID')} pcs</div></div>`).join('');
  el.innerHTML = `<div class="grid">${rowsHtml}<div class="stat"><div class="label">Total Semua</div><div class="value">${grand.toLocaleString('id-ID')} pcs</div></div></div>`;
}
function hitungRingkasanProduksi(){
  const box = document.getElementById('produksi-ringkasan');
  if(!box) return;
  let totalAktual = 0;
  document.querySelectorAll('.produksi-varian-input').forEach(inp=>{ totalAktual += parseFloat(inp.value)||0; });
  const it = produksiSelectedItemId ? itemById(produksiSelectedItemId) : null;
  const satuan = it ? it.satuan : '';
  const satHasil = satuanHasilItem(it);
  const profiles = getProduksiSelectedProfiles();
  const totalResep = profiles.reduce((s,{resep,count})=>s+resep.resepQty*count,0);
  const totalStandar = profiles.reduce((s,{resep,count})=>s+standarProfilTotal(resep)*count,0);
  const totalPremixKg = profiles.reduce((s,{resep,count})=> s+(resep.premixKg>0?resep.premixKg*count:0),0);
  const semuaAdaKg = profiles.length>0 && profiles.every(({resep})=>resep.premixKg>0);
  const standarJadi = totalStandar;
  const selisih = totalAktual - standarJadi;
  const premixSeharusnya = totalStandar>0 ? totalResep*(totalAktual/totalStandar) : null;
  document.getElementById('rp-standar').textContent = standarJadi.toLocaleString('id-ID',{maximumFractionDigits:1})+' '+satHasil;
  document.getElementById('rp-jadi').textContent = totalAktual.toLocaleString('id-ID')+' '+satHasil;
  const selisihEl = document.getElementById('rp-selisih');
  selisihEl.textContent = (selisih>0?'+':'')+selisih.toLocaleString('id-ID',{maximumFractionDigits:1})+' '+satHasil;
  document.getElementById('rp-selisih-box').className = 'stat '+(selisih<0?'neg':(selisih>0?'pos':''));
  document.getElementById('rp-premix-seharusnya').textContent = premixSeharusnya!=null ? premixSeharusnya.toLocaleString('id-ID',{maximumFractionDigits:2})+' resep(r)' : '-';
  const rpDiambilEl = document.getElementById('rp-premix-diambil');
  if(rpDiambilEl){
    if(profiles.length===0){ rpDiambilEl.textContent = '-'; }
    else if(semuaAdaKg){ rpDiambilEl.textContent = totalPremixKg.toLocaleString('id-ID',{maximumFractionDigits:3})+' '+satuan+` (${totalResep.toLocaleString('id-ID',{maximumFractionDigits:2})} r)`; }
    else { rpDiambilEl.textContent = `${totalResep.toLocaleString('id-ID',{maximumFractionDigits:2})} resep (belum ada acuan kg lengkap)`; }
  }
  const noteEl = document.getElementById('produksi-belum-kg-note');
  if(noteEl) noteEl.textContent = (profiles.length>0 && !semuaAdaKg) ? 'Sebagian ukuran resep yang dipilih belum diisi "Total Premix Dipakai" di tab Kode, jadi stok yang dikurangi untuk kombinasi ini masih memakai angka jumlah resep secara langsung. Isi dulu di tab Kode kalau mau stok premix terpotong otomatis sesuai berat sebenarnya.' : '';
}

    <div class="inline" style="margin-bottom:8px;">
      <button type="button" class="primary" data-kg-preset="1">1 kg</button>
      <button type="button" class="primary" data-kg-preset="3">3 kg</button>

      ${varianSelectHtml}
      <div class="field"><label>Berat Premix Dipakai (kg)</label>
        <input type="number" step="any" min="0" id="kalkulator-kg-input" value="1"
          data-pcs-min="${akAktif.pcsPerKgMin}" data-pcs-max="${akAktif.pcsPerKgMax}"
          data-isi-per-box="${akAktif.isiPerBox||0}" data-berkurang="${akAktif.berkurangBoxPercent||0}"
          oninput="updateEstimasiAcuan();">
      </div>
      <div class="field"><label>&nbsp;</label>
        <label style="display:flex;align-items:center;gap:6px;padding:8px 0;"><input type="checkbox" id="kalkulator-box-toggle" checked onchange="updateEstimasiAcuan();"> Dikemas Box</label>
      </div>
    </form>
    <div class="grid" style="margin-top:10px;">
      <div class="stat"><div class="label">Estimasi Pcs</div><div class="value" id="kalkulator-hasil-pcs">-</div></div>
      <div class="stat" id="kalkulator-box-stat"><div class="label">Estimasi Box</div><div class="value" id="kalkulator-hasil-box">-</div></div>
    </div>
  </div>`;
}
function updateEstimasiAcuan(){
  const kgInput = document.getElementById('kalkulator-kg-input');
  if(!kgInput) return;
  const kg = parseFloat(kgInput.value)||0;
  const akSelect = document.getElementById('kalkulator-ak-select');
  let min, max, isiPerBox, berkurang;
  if(akSelect && akSelect.selectedOptions && akSelect.selectedOptions[0]){
    const opt = akSelect.selectedOptions[0];
    min = parseFloat(opt.dataset.pcsMin)||0;
    max = parseFloat(opt.dataset.pcsMax)||0;
    isiPerBox = parseFloat(opt.dataset.isiPerBox)||0;
    berkurang = parseFloat(opt.dataset.berkurang)||0;
  } else {
    min = parseFloat(kgInput.dataset.pcsMin)||0;
    max = parseFloat(kgInput.dataset.pcsMax)||0;
    isiPerBox = parseFloat(kgInput.dataset.isiPerBox)||0;
    berkurang = parseFloat(kgInput.dataset.berkurang)||0;
  }
  const pcsMin = kg*min, pcsMax = kg*max;
  const hasilPcsEl = document.getElementById('kalkulator-hasil-pcs');
  if(hasilPcsEl) hasilPcsEl.textContent = pcsMin===pcsMax
    ? Math.round(pcsMin).toLocaleString('id-ID')+' pcs'
    : Math.round(pcsMin).toLocaleString('id-ID')+'-'+Math.round(pcsMax).toLocaleString('id-ID')+' pcs';
  const boxToggle = document.getElementById('kalkulator-box-toggle');
  const boxStat = document.getElementById('kalkulator-box-stat');
  const hasilBoxEl = document.getElementById('kalkulator-hasil-box');
  if(!boxStat || !hasilBoxEl) return;
  if(boxToggle && boxToggle.checked && isiPerBox>0){
    boxStat.style.display = '';
    const pcsMinBox = pcsMin*(1-berkurang/100);
    const pcsMaxBox = pcsMax*(1-berkurang/100);
    const boxMin = Math.floor(pcsMinBox/isiPerBox);
    const boxMax = Math.floor(pcsMaxBox/isiPerBox);
    hasilBoxEl.textContent = boxMin===boxMax ? boxMin.toLocaleString('id-ID')+' box' : boxMin.toLocaleString('id-ID')+'-'+boxMax.toLocaleString('id-ID')+' box';
  } else {
    boxStat.style.display = 'none';
  }
}

    <form class="inline" style="margin-bottom:10px;">
      <div class="field"><label>Jenis Retur</label>
        <select id="retur-jenis-select">
          <option value="premix" ${returJenis==='premix'?'selected':''}>Premix (ke Supplier)</option>
          <option value="roti" ${returJenis==='roti'?'selected':''}>Roti Jadi (dari Cabang)</option>
        </select>
      </div>
    </form>
    ${returJenis==='premix' ? `
    ${premixItems.length===0 ? '<div class="empty">Tambahkan barang Premix dulu di tab Kode</div>' : `
    <form class="inline" id="form-retur-premix">
      <div class="field"><label>Tanggal</label><input name="tanggal" type="date" value="${today()}" required></div>
      <div class="field"><label>Premix</label><select name="itemId" required>${premixOptions}</select></div>
      <div class="field"><label>Jumlah</label><input name="qty" type="number" step="any" min="0" required></div>
      <div class="field"><label>Alasan</label><input name="alasan" placeholder="cth: premix rusak/kadaluarsa"></div>
      <button class="primary" type="submit">Simpan Retur Premix</button>
    </form>`}` : `
    ${varianNama.length===0 ? '<div class="empty">Belum ada varian roti — catat dulu di tab Produksi</div>' : `
    <form class="inline" id="form-retur-roti">
      <div class="field"><label>Tanggal</label><input name="tanggal" type="date" value="${today()}" required></div>
      <div class="field"><label>Varian Roti</label><select name="varianNama" required>${varianOptions}</select></div>
      <div class="field"><label>Cabang / Toko Asal</label><select name="cabang" required>${cabangOptions}</select></div>
      <div class="field"><label>Jumlah (pcs)</label><input name="jumlah" type="number" min="0" required></div>
      <div class="field"><label>Nilai Kerugian (Rp)</label><input name="nilai" type="number" min="0" placeholder="opsional"></div>
      <div class="field"><label>Alasan</label><input name="alasan" placeholder="cth: tidak laku/kadaluarsa"></div>

// -- Laporan Selisih Stok: dibaca dari data Stock Opname yang sudah ada (opname[].entries[]),
// bukan mekanisme stok baru. Setiap entry opname sudah menyimpan stokSistem, stokFisik,
// selisih, alasan, dan trxId (kalau sudah "Sesuaikan Stok" diterapkan).
//
// Audit trxId: opname.diterapkan=true TIDAK otomatis berarti adjustment-nya masih valid,
// karena trx bisa terhapus lewat jalur lain (hapus barang di tab Kode, atau hapus manual
// satu transaksi di tab Masuk/Keluar/Arus) tanpa melalui "Hapus" di tab Opname. Fungsi ini
// memverifikasi trxId terhadap array trx yang sebenarnya, supaya status yang ditampilkan
// tidak diam-diam menganggap adjustment berhasil.
function auditAdjustmentEntry(o, e){
  if(!o.diterapkan) return {label:'Belum disesuaikan', cls:'', trxInfo:'-'};
  if(e.trxId){
    const found = trx.find(t=>t.id===e.trxId);
    if(found) return {label:'Sudah disesuaikan', cls:'sisa-ok', trxInfo:`${found.tipe==='masuk'?'Masuk':'Keluar'} ${found.qty.toLocaleString('id-ID')} — ${found.tanggal}`};
    return {label:'⚠ Bermasalah (transaksi hilang)', cls:'sisa-low', trxInfo:`trxId ${e.trxId} tidak ditemukan di trx`};
  }
  // data lama (dibuat sebelum fitur trxId ada) — tidak dianggap error, tapi tidak bisa diverifikasi otomatis
  return {label:'Sudah disesuaikan (data lama, trxId tidak tersimpan)', cls:'', trxInfo:'Tidak terlacak (data lama)'};
}

function hitungLaporanSelisih(dari, sampai, itemId, kategori){
  const inRange = (tgl)=> (!dari||tgl>=dari) && (!sampai||tgl<=sampai);
  const rows = [];
  opname.slice().sort((a,b)=>b.tanggal.localeCompare(a.tanggal)).forEach(o=>{
    if(!inRange(o.tanggal)) return;
    (o.entries||[]).forEach(e=>{
      if(e.selisih===0) return; // laporan selisih hanya menampilkan barang yang benar-benar beda
      const it = itemById(e.itemId);
      if(itemId && e.itemId!==itemId) return;
      if(kategori && (!it || it.kategori!==kategori)) return;
      rows.push({opname:o, entry:e, it});
    });
  });

  const totalNilaiSelisih = rows.reduce((s,r)=> s + (r.it ? r.entry.selisih*r.it.harga : 0), 0);
  const audits = rows.map(r=>auditAdjustmentEntry(r.opname, r.entry));
  const jumlahSudah = audits.filter(a=>a.label==='Sudah disesuaikan').length;
  const jumlahBermasalah = audits.filter(a=>a.label.startsWith('⚠')).length;
  const jumlahBelumFix = audits.filter(a=>a.label==='Belum disesuaikan').length;

  const bodyRows = rows.map((r,idx)=>{
    const {opname:o, entry:e, it} = r;
    const audit = audits[idx];
    const satuan = it ? it.satuan : '';
    const namaBarang = it ? `<span class="kode-badge">${it.kode}</span> ${it.nama}` : '(barang dihapus)';
    const kategoriLabel = it ? (KATEGORI[it.kategori]? KATEGORI[it.kategori].label : it.kategori) : '-';
    const nilaiSelisih = it ? e.selisih*it.harga : 0;
    return `<tr>
      <td>${idx+1}</td>
      <td>${o.tanggal}</td>
      <td>${o.jenis||'-'}</td>
      <td>${namaBarang}</td>
      <td>${kategoriLabel}</td>
      <td>${e.stokSistem.toLocaleString('id-ID')} ${satuan}</td>
      <td>${e.stokFisik.toLocaleString('id-ID')} ${satuan}</td>
      <td class="${e.selisih<0?'sisa-low':'sisa-ok'}">${e.selisih>0?'+':''}${e.selisih.toLocaleString('id-ID')} ${satuan}</td>
      <td class="${nilaiSelisih<0?'sisa-low':'sisa-ok'}">${rupiah(nilaiSelisih)}</td>
      <td>${e.alasan || '-'}</td>
      <td class="${audit.cls}">${audit.label}</td>
      <td>${audit.trxInfo}</td>
    </tr>`;
  }).join('');

  document.getElementById('lapsel-hasil').innerHTML = `
  <div class="card">
    <h2>Ringkasan Selisih</h2>
    <div class="grid">
      <div class="stat"><div class="label">Jumlah Barang Selisih</div><div class="value">${rows.length}</div></div>
      <div class="stat ${totalNilaiSelisih<0?'neg':'pos'}"><div class="label">Total Nilai Selisih</div><div class="value">${rupiah(totalNilaiSelisih)}</div></div>
      <div class="stat"><div class="label">Sudah Disesuaikan (Terverifikasi)</div><div class="value">${jumlahSudah}</div></div>
      <div class="stat"><div class="label">Belum Disesuaikan</div><div class="value">${jumlahBelumFix}</div></div>
      <div class="stat ${jumlahBermasalah>0?'neg':''}"><div class="label">Bermasalah (Transaksi Hilang)</div><div class="value">${jumlahBermasalah}</div></div>
    </div>
    ${jumlahBermasalah>0 ? `<div class="note" style="margin-top:10px;color:var(--red);"><b>Perhatian:</b> ${jumlahBermasalah} adjustment tercatat "diterapkan" tapi transaksi penyesuaiannya sudah tidak ada di data Masuk/Keluar (kemungkinan barang atau transaksi tersebut dihapus manual di tab lain). Stok saat ini kemungkinan tidak lagi mencerminkan hasil opname tersebut.</div>` : ''}
  </div>
  <div class="card">
    <h2>Detail Selisih Stok (${rows.length})</h2>
    <table><thead><tr><th>No</th><th>Tanggal Opname</th><th>Jenis Opname</th><th>Barang</th><th>Kategori</th><th>Stok Sistem</th><th>Stok Fisik</th><th>Selisih</th><th>Nilai Selisih</th><th>Alasan</th><th>Status Adjustment</th><th>Transaksi Terkait</th></tr></thead>
    <tbody>${bodyRows || '<tr><td colspan="12" class="empty">Tidak ada selisih pada filter ini</td></tr>'}</tbody></table>
  </div>`;
}

function hitungLaporan(dari, sampai){
  const inRange = (tgl)=> (!dari||tgl>=dari) && (!sampai||tgl<=sampai);
  const trxR = trx.filter(t=>inRange(t.tanggal));
  const penjR = penjualan.filter(p=>inRange(p.tanggal));
  const produksiR = produksi.filter(p=>inRange(p.tanggal));
  const packingR = packing.filter(p=>inRange(p.tanggal));

  // ===== TAHAP 10 — Ringkasan Manajemen =====
  // Dihitung lewat hitungInternalControlSnapshot() yang sama dengan Dashboard Internal Control,
  // supaya angkanya selalu konsisten dengan tab Dashboard (satu sumber perhitungan).
  const ic = hitungInternalControlSnapshot(dari, sampai);
  const icAlertRows = ic.alerts.map(a=>{
    const cls = a.level==='red'?'sisa-low':(a.level==='amber'?'':'sisa-ok');
    const style = a.level==='amber' ? 'color:var(--amber);font-weight:700;' : '';
    const badge = a.level==='red'?'Perlu Tindakan':(a.level==='amber'?'Perhatian':'Normal');
    return `<div class="note" style="margin-bottom:6px;"><span class="${cls}" style="${style}">[${badge}]</span> ${a.text}</div>`;
  }).join('');

  // ===== TAHAP 10 — Laporan Stok (snapshot saat ini, per barang) =====
  // Sumber: items + stokItem() + hitungReorderData() — sama dengan yang dipakai tab Kode/Arus/Dashboard.
  const reorderMap = {}; ic.reorderData.forEach(d=> reorderMap[d.it.id]=d);
  const laporanStokRows = items.slice().sort((a,b)=> (a.kategori===b.kategori? a.nama.localeCompare(b.nama) : a.kategori.localeCompare(b.kategori)))
    .map(it=>{
      const sisa = stokItem(it.id).sisa;
      const nilai = sisa*it.harga;
      const rd = reorderMap[it.id];
      let status, statusCls;
      if(sisa<0){ status='Minus'; statusCls='sisa-low'; }
      else if(rd && rd.estimasiHari!=null && rd.estimasiHari<7){ status='Segera Reorder (<7 hari)'; statusCls='sisa-low'; }
      else if(sisa===0){ status='Habis'; statusCls='sisa-low'; }
      else { status='Aman'; statusCls='sisa-ok'; }
      return `<tr>
        <td><span class="kode-badge">${it.kode}</span></td>
        <td>${it.nama}</td>
        <td><span class="tag ${it.kategori}">${KATEGORI[it.kategori].label}</span></td>
        <td>${sisa.toLocaleString('id-ID')} ${it.satuan}</td>
        <td>${rupiah(it.harga)}</td>
        <td>${rupiah(nilai)}</td>
        <td class="${statusCls}">${status}</td>
      </tr>`;
    }).join('');

  // ===== TAHAP 10 — Laporan Packing (detail per produk/varian & tujuan, periode terpilih) =====
  const packingDetailMap = {};
  packingR.forEach(p=>{
    (p.varian||[]).forEach(v=>{
      if(!(v.jumlah>0)) return;
      const key = v.nama+'|'+p.cabang;
      if(!packingDetailMap[key]) packingDetailMap[key] = {varian:v.nama, tujuan:p.cabang||'-', jumlah:0};
      packingDetailMap[key].jumlah += v.jumlah;
    });
  });
  const packingDetailRows = Object.values(packingDetailMap).sort((a,b)=> b.jumlah-a.jumlah || a.varian.localeCompare(b.varian))
    .map(d=>`<tr><td>${d.varian}</td><td>${d.tujuan}</td><td>${d.jumlah.toLocaleString('id-ID')} pcs</td></tr>`).join('');

  const perKategori = {};
  Object.keys(KATEGORI).forEach(k=> perKategori[k]={qtyMasuk:0,nilaiMasuk:0,qtyKeluar:0,nilaiKeluar:0});
  trxR.forEach(t=>{
    const it=itemById(t.itemId); if(!it) return;
    const nilai = it.harga*t.qty;
    if(t.tipe==='masuk'){ perKategori[it.kategori].qtyMasuk+=t.qty; perKategori[it.kategori].nilaiMasuk+=nilai; }
    else { perKategori[it.kategori].qtyKeluar+=t.qty; perKategori[it.kategori].nilaiKeluar+=nilai; }
  });

  const totalMasukKotor = Object.values(perKategori).reduce((s,k)=>s+k.nilaiMasuk,0);
  const nilaiReturPremix = returTotalNilai('premix', dari, sampai);
  const nilaiReturRoti = returTotalNilai('roti', dari, sampai);
  const jumlahReturRotiPcs = returTotalJumlahRoti(dari, sampai);
  const totalUangKeluar = totalMasukKotor - nilaiReturPremix;
  const totalOmzet = penjR.reduce((s,p)=>s+p.omzet,0);
  const labaRugi = totalOmzet - totalUangKeluar - nilaiReturRoti;
  const totalHasilProduksi = produksiR.reduce((s,p)=>s+(p.totalHasil||0),0);
  const totalHasilPacking = packingR.reduce((s,p)=>s+(p.varian||[]).reduce((ss,v)=>ss+v.jumlah,0),0);

  const rows = Object.keys(KATEGORI).map(k=>{
    const d = perKategori[k];
    const it0 = items.filter(i=>i.kategori===k);
    const satuan = it0[0]? it0[0].satuan : '';
    return `<tr><td><span class="tag ${k}">${KATEGORI[k].label}</span></td><td>${d.qtyMasuk.toLocaleString('id-ID')} ${satuan}</td><td>${rupiah(d.nilaiMasuk)}</td><td>${d.qtyKeluar.toLocaleString('id-ID')} ${satuan}</td><td>${rupiah(d.nilaiKeluar)}</td></tr>`;
  }).join('');

  const perSupplier = {};
  SUPPLIERS.forEach(s=> perSupplier[s]={premix:0,bahan:0,kardus:0,total:0});
  trxR.filter(t=>t.tipe==='masuk' && t.supplier).forEach(t=>{
    const it = itemById(t.itemId); if(!it) return;
    const nilai = it.harga*t.qty;
    if(!perSupplier[t.supplier]) perSupplier[t.supplier] = {premix:0,bahan:0,kardus:0,total:0};
    perSupplier[t.supplier][it.kategori] += nilai;
    perSupplier[t.supplier].total += nilai;
  });
  const supplierRows = Object.keys(perSupplier).map(s=>{
    const d = perSupplier[s];
    return `<tr><td>${s}</td><td>${rupiah(d.premix)}</td><td>${rupiah(d.bahan)}</td><td>${rupiah(d.kardus)}</td><td><b>${rupiah(d.total)}</b></td></tr>`;
  }).join('');

  // -- Produksi vs Standar per Premix (periode) --
  const perPremixProduksi = {};
  produksiR.forEach(p=>{
    const it = itemById(p.premixItemId); if(!it) return;
    if(!perPremixProduksi[it.id]) perPremixProduksi[it.id] = {nama:it.nama, count:0, qtyPremix:0, totalHasil:0, standarJadi:0, adaStandar:false};
    const d = perPremixProduksi[it.id];
    d.count++;
    d.qtyPremix += p.qtyPremix||0;
    d.totalHasil += p.totalHasil||0;
    if(p.standarJadi!=null){ d.standarJadi += p.standarJadi; d.adaStandar = true; }
  });
  const produksiStandarRows = Object.values(perPremixProduksi).map(d=>{
    const selisih = d.adaStandar ? d.totalHasil-d.standarJadi : null;
    const efisiensi = d.adaStandar && d.standarJadi>0 ? (d.totalHasil/d.standarJadi*100) : null;
    return `<tr><td>${d.nama}</td><td>${d.count}x</td><td>${d.totalHasil.toLocaleString('id-ID')} pcs</td>
      <td>${d.adaStandar? d.standarJadi.toLocaleString('id-ID',{maximumFractionDigits:1})+' pcs':'-'}</td>
      <td>${selisih!=null? `<span class="${selisih<0?'sisa-low':'sisa-ok'}">${selisih>0?'+':''}${selisih.toLocaleString('id-ID',{maximumFractionDigits:1})} pcs</span>`:'-'}</td>
      <td>${efisiensi!=null? efisiensi.toLocaleString('id-ID',{maximumFractionDigits:1})+'%':'-'}</td></tr>`;
  }).join('');

  // -- Perkiraan Stok Habis (Reorder) — berdasarkan rata pemakaian 30 hari terakhir, tidak terikat periode laporan --
  const reorderData = hitungReorderData();
  const reorderRows = reorderData.map(d=>`<tr>
    <td>${d.it.nama}</td>
    <td class="${d.sisa<0?'sisa-low':''}">${d.sisa.toLocaleString('id-ID')} ${d.it.satuan}</td>
    <td>${d.rataHarian.toLocaleString('id-ID',{maximumFractionDigits:2})} ${d.it.satuan}/hari</td>
    <td class="${d.estimasiHari!=null && d.estimasiHari<7 ? 'sisa-low':'sisa-ok'}">${d.estimasiHari!=null? Math.round(d.estimasiHari).toLocaleString('id-ID')+' hari':'-'}</td>
  </tr>`).join('');

  // -- Produk Roti Terlaris (berdasarkan jumlah dipacking/dikirim ke cabang & toko, periode ini) --
  const terlarisMap = {};
  packingR.forEach(p=>{
    (p.varian||[]).forEach(v=>{
      if(v.jumlah>0) terlarisMap[v.nama] = (terlarisMap[v.nama]||0)+v.jumlah;
    });
  });

  const perCabang = {};

  // -- Tren Packing per Bulan (periode) --
  const packingPerBulan = {};

    const bln = p.tanggal.slice(0,7);
    const totalPcs = (p.varian||[]).reduce((s,v)=>s+v.jumlah,0);
    if(!packingPerBulan[bln]) packingPerBulan[bln] = {count:0, totalPcs:0};

  const packingTrenRows = Object.keys(packingPerBulan).sort().map(bln=>{

  // -- Barang Lambat Bergerak — tidak ada pemakaian sama sekali dalam 30 hari terakhir tapi masih ada stok

  // -- Tren Stok Masuk/Keluar per Bulan (periode) --

function teksLaporanSore(){
  const tgl = new Date().toLocaleDateString('id-ID', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
  let teks = `*LAPORAN SISA STOK GUDANG*\n${tgl}\n\n`;
  let grandTotal = 0;
  Object.keys(KATEGORI).forEach(k=>{
    const list = items.filter(i=>i.kategori===k);
    if(list.length===0) return;
    teks += `*${KATEGORI[k].label.toUpperCase()}*\n`;
    let subTotal = 0;
    list.forEach(it=>{
      const s = stokItem(it.id);
      const nilai = s.sisa*it.harga;
      subTotal += nilai;
      teks += `- ${it.nama}: ${s.sisa.toLocaleString('id-ID')} ${it.satuan} (${rupiah(nilai)})\n`;
    });
    teks += `Subtotal ${KATEGORI[k].label}: ${rupiah(subTotal)}\n\n`;
    grandTotal += subTotal;
  });
  teks += `*TOTAL NILAI SEMUA SISA STOK: ${rupiah(grandTotal)}*`;
  return teks;
}

function viewLaporanSore(){
  const teks = teksLaporanSore();
  let grandTotal = 0;
  const kategoriCards = Object.keys(KATEGORI).map(k=>{
    const list = items.filter(i=>i.kategori===k);
    let subTotal = 0;
    const rows = list.map((it,idx)=>{
      const s = stokItem(it.id);
      const nilai = s.sisa*it.harga;
      subTotal += nilai;
      return `<tr><td>${idx+1}</td><td><span class="kode-badge">${it.kode}</span></td><td>${it.nama}</td><td class="${s.sisa<0?'sisa-low':'sisa-ok'}">${s.sisa.toLocaleString('id-ID')} ${it.satuan}</td><td>${rupiah(nilai)}</td></tr>`;
    }).join('');
    grandTotal += subTotal;
    return `<div class="card">
      <h2><span class="tag ${k}">${KATEGORI[k].label}</span></h2>
      <table><thead><tr><th>No</th><th>Kode</th><th>Nama</th><th>Sisa</th><th>Nilai</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" class="empty">Belum ada barang</td></tr>'}</tbody></table>
      <div class="note">Subtotal ${KATEGORI[k].label}: <b>${rupiah(subTotal)}</b></div>
    </div>`;
  }).join('');

  return `
  <div class="card">
    <h2>Laporan Sisa Stok Sore Ini</h2>
    <div class="sub">Dikirim setiap sore oleh admin gudang: rekap sisa Premix, Bahan Baku &amp; Kardus beserta total uangnya. Klik tombol di bawah untuk menyalin teks siap kirim ke WhatsApp.</div>
    <div class="grid">
      <div class="stat"><div class="label">Total Nilai Semua Sisa Stok</div><div class="value">${rupiah(grandTotal)}</div></div>
    </div>
    <div style="margin-top:10px;"><button class="primary" id="btn-copy-laporan-sore">📋 Salin Teks untuk WhatsApp</button> <span id="copy-status" class="note"></span></div>
  </div>
  ${kategoriCards}
  `;
}

function attachHandlers(){
  const fi = document.getElementById('form-item');
  if(fi){
    fi.onsubmit = async (e)=>{
      e.preventDefault();
      const fd = new FormData(fi);
      if(editingItemId){
        const it = itemById(editingItemId);
        if(it){
          const before = {...it};
          it.nama = fd.get('nama').trim();
          it.satuan = fd.get('satuan').trim();
          it.harga = parseFloat(fd.get('harga'))||0;
          if(it.kategori==='premix'){
            it.jenisHitung = fd.get('jenisHitung') || it.jenisHitung || 'mix';
            it.satuanHasil = fd.get('satuanHasil') || satuanHasilItem(it);
          }
          await save('items', items);
          await catatEdit('items', it.id, `Kode Barang — ${it.kode}`, before, it);
        }
        editingItemId = null;
        renderAll();
        return;
      }
      const kategori = fd.get('kategori');
      const novo = { id:uid(), kode: nextKode(kategori), kategori, nama: fd.get('nama').trim(),
        satuan: fd.get('satuan').trim(), harga: parseFloat(fd.get('harga'))||0 };
      if(kategori==='premix'){
        novo.resepList = [];
        novo.jenisHitung = fd.get('jenisHitung') || 'mix';
        novo.satuanHasil = fd.get('satuanHasil') || 'pcs';
      }
      items.push(novo);
      await save('items', items);
      renderAll();
    };
  }
  document.querySelectorAll('[data-edit-item]').forEach(b=>{
    b.onclick = ()=>{ editingItemId = b.dataset.editItem; renderAll(); };
  });
  const btnBatalEditItem = document.getElementById('btn-batal-edit-item');
  if(btnBatalEditItem){ btnBatalEditItem.onclick = ()=>{ editingItemId = null; renderAll(); }; }
  document.querySelectorAll('[data-goto-keluar]').forEach(b=>{
    b.onclick = ()=>{ activeTab='keluar'; renderAll(); };
  });
  document.querySelectorAll('[data-del-item]').forEach(b=>{
    b.onclick = async ()=>{
      const id=b.dataset.delItem;
      items = items.filter(i=>i.id!==id);
      trx = trx.filter(t=>t.itemId!==id);
      await save('items', items); await save('trx', trx);
      if(resepBuilderItemId===id){ resepBuilderItemId=null; tempResepVarian=[]; }
      if(editingItemId===id) editingItemId=null;
      renderAll();
    };
  });

  // -- Kode: Acuan Konversi premix -> pcs & box (multi-varian) --
  function syncBulkAkFromDom(){
    document.querySelectorAll('.bulk-ak-nama').forEach(el=>{ const i=parseInt(el.dataset.idx); if(bulkAkRows[i]) bulkAkRows[i].nama = el.value; });
    document.querySelectorAll('.bulk-ak-pcsmin').forEach(el=>{ const i=parseInt(el.dataset.idx); if(bulkAkRows[i]) bulkAkRows[i].pcsPerKgMin = el.value; });
    document.querySelectorAll('.bulk-ak-pcsmax').forEach(el=>{ const i=parseInt(el.dataset.idx); if(bulkAkRows[i]) bulkAkRows[i].pcsPerKgMax = el.value; });
    document.querySelectorAll('.bulk-ak-isibox').forEach(el=>{ const i=parseInt(el.dataset.idx); if(bulkAkRows[i]) bulkAkRows[i].isiPerBox = el.value; });
    document.querySelectorAll('.bulk-ak-berkurang').forEach(el=>{ const i=parseInt(el.dataset.idx); if(bulkAkRows[i]) bulkAkRows[i].berkurangBoxPercent = el.value; });
  }
  document.querySelectorAll('.bulk-ak-nama, .bulk-ak-pcsmin, .bulk-ak-pcsmax, .bulk-ak-isibox, .bulk-ak-berkurang').forEach(el=>{
    el.onchange = syncBulkAkFromDom;
  });
  const btnTambahBarisBulkAk = document.getElementById('btn-tambah-baris-bulk-ak');
  if(btnTambahBarisBulkAk){
    btnTambahBarisBulkAk.onclick = ()=>{
      syncBulkAkFromDom();
      bulkAkRows.push({nama:'',pcsPerKgMin:'',pcsPerKgMax:'',isiPerBox:'',berkurangBoxPercent:''});
      renderAll();
    };
  }
  document.querySelectorAll('[data-del-bulk-ak-row]').forEach(b=>{
    b.onclick = ()=>{
      syncBulkAkFromDom();
      bulkAkRows.splice(parseInt(b.dataset.delBulkAkRow),1);
      if(bulkAkRows.length===0) bulkAkRows=[{nama:'',pcsPerKgMin:'',pcsPerKgMax:'',isiPerBox:'',berkurangBoxPercent:''}];
      renderAll();
