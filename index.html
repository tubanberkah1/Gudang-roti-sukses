        const it = itemById(r.itemId);
        const resep = it ? (it.resepList||[]).find(x=>x.id===r.resepId) : null;
        const paket = parseFloat(r.paket)||1;
        const hasilJumlah = parseFloat(r.hasilJumlah)||0;
        const hasilNama = (r.hasilNama||it.nama).trim();
        const qtyPremix = resep ? resep.resepQty*paket : paket;
        const premixDiambil = (resep && resep.premixKg>0) ? resep.premixKg*paket : null;
        const qtyKeluarStok = premixDiambil!=null ? premixDiambil : qtyPremix;
        const standarJadi = resep ? standarProfilTotal(resep)*paket : null;
        const premixSeharusnya = (standarJadi>0) ? qtyPremix*(hasilJumlah/standarJadi) : null;
        const trxRecMulti = await tambahTrx({tanggal, itemId:r.itemId, tipe:'keluar', qty:qtyKeluarStok, ket:'Produksi'+(resep?` (${resep.resepQty}Rx${paket})`:'')+(ket?': '+ket:'')});
        produksi.push({id:uid(), tanggal, premixItemId:r.itemId, resepId: resep?resep.id:null,
          resepRincian: resep ? [{resepQty:resep.resepQty, count:paket}] : null,
          qtyPremix, premixDiambil, varianHasil:[{nama:hasilNama, jumlah:hasilJumlah}], totalHasil:hasilJumlah,
          ket, standarJadi, premixSeharusnya, trxId: trxRecMulti?trxRecMulti.id:null});
      }
      await save('produksi', produksi);
      produksiMultiRows = [{itemId:'',resepId:'',paket:1,hasilNama:'',hasilJumlah:''}];
      renderAll();
    };
  }

  // -- Produksi --
  const produksiItemSelect = document.getElementById('produksi-item-select');
  if(produksiItemSelect){
    produksiItemSelect.onchange = ()=>{
      produksiSelectedItemId = produksiItemSelect.value || null;
      produksiSelectedResepId = null; produksiManualRows = []; kalkulatorAkVarianId = null;
      renderAll();
    };
  }
  const fp = document.getElementById('form-produksi');
  if(fp){
    fp.onsubmit = async (e)=>{
      e.preventDefault();
      const fd = new FormData(fp);
      const itForSubmit = produksiSelectedItemId ? itemById(produksiSelectedItemId) : null;
      if(itForSubmit && (itForSubmit.jenisHitung||'mix')==='standarPerR'){
        const varianHasilSPR = [];
        let totalCek = 0, totalDiambil = 0, adaDiambil = false;
        document.querySelectorAll('#produksi-varian-tbody tr[data-varian-row]').forEach(tr=>{
          const inp = tr.querySelector('.produksi-varian-input');
          const diambilInp = tr.querySelector('.produksi-varian-diambil-input');
          const jumlah = parseFloat(inp.value)||0;
          const standar = parseFloat(inp.dataset.standar)||0;
          const diambilRaw = diambilInp ? diambilInp.value : '';
          const diambil = diambilRaw===''? null : (parseFloat(diambilRaw)||0);
          if(jumlah>0 || diambil!=null){
            const cek = standar>0 ? jumlah/standar : 0;
            if(jumlah>0) totalCek += cek;
            if(diambil!=null){ totalDiambil += diambil; adaDiambil = true; }
            varianHasilSPR.push({ nama: inp.dataset.nama, jumlah, standar, cek, diambil });
          }
        });
        if(varianHasilSPR.length===0){ alert('Isi minimal satu hasil varian roti'); return; }
        if(!adaDiambil){ alert('Isi dulu "Premix Diambil" untuk minimal satu rasa/ukuran sebelum simpan'); return; }
        const totalHasilSPR = varianHasilSPR.reduce((s,v)=>s+v.jumlah,0);
        const resepDiambilManual = totalDiambil;
        const selisihResepManual = totalCek - resepDiambilManual;
        const tanggalSPR = fd.get('tanggal');
        const ketSPR = fd.get('ket')||'';
        const labelBatch = fd.get('labelBatch')||'';
        const trxRecSPR = await tambahTrx({tanggal:tanggalSPR, itemId:produksiSelectedItemId, tipe:'keluar', qty:resepDiambilManual, ket:'Produksi'+(labelBatch?' ('+labelBatch+')':'')+(ketSPR?': '+ketSPR:'')});
        produksi.push({id:uid(), tanggal:tanggalSPR, premixItemId:produksiSelectedItemId, resepId:null, resepRincian:null,
          qtyPremix:resepDiambilManual, premixDiambil:null, varianHasil:varianHasilSPR, totalHasil:totalHasilSPR,
          ket:ketSPR, labelBatch, standarJadi:null, premixSeharusnya:totalCek, resepDiambilManual, selisihResepManual, trxId: trxRecSPR?trxRecSPR.id:null});
        await save('produksi', produksi);
        produksiSelectedItemId=null; produksiSelectedResepId=null;
        renderAll();
        return;
      }
      const profiles = getProduksiSelectedProfiles();
      if(profiles.length===0){ alert('Isi jumlah pemakaian untuk minimal satu ukuran resep (1R/3R/5R dst) dulu'); return; }
      const varianHasil = [];
      document.querySelectorAll('.produksi-varian-input').forEach(inp=>{
        const jumlah = parseFloat(inp.value)||0;
        if(jumlah>0) varianHasil.push({ nama: inp.dataset.nama, jumlah, min: parseFloat(inp.dataset.min)||0, max: parseFloat(inp.dataset.max)||0 });
      });
      if(varianHasil.length===0){ alert('Isi minimal satu hasil varian roti'); return; }
      const totalHasil = varianHasil.reduce((s,v)=>s+v.jumlah,0);
      const tanggal = fd.get('tanggal');
      const ket = fd.get('ket')||'';
      const totalResep = profiles.reduce((s,{resep,count})=>s+resep.resepQty*count,0);
      const totalStandar = profiles.reduce((s,{resep,count})=>s+standarProfilTotal(resep)*count,0);
      const totalPremixKg = profiles.reduce((s,{resep,count})=> s+(resep.premixKg>0?resep.premixKg*count:0),0);
      const semuaAdaKg = profiles.every(({resep})=>resep.premixKg>0);
      const standarJadi = totalStandar;
      const premixSeharusnya = totalStandar>0 ? totalResep*(totalHasil/totalStandar) : null;
      const premixDiambil = semuaAdaKg ? totalPremixKg : null;
      const qtyKeluarStok = premixDiambil!=null ? premixDiambil : totalResep;
      const resepRincian = profiles.map(({resep,count})=>({resepId:resep.id, resepQty:resep.resepQty, count}));
      const rincianTxt = resepRincian.map(r=>`${r.resepQty}Rx${r.count}`).join(' + ');
      const trxRecProd = await tambahTrx({tanggal, itemId:produksiSelectedItemId, tipe:'keluar', qty:qtyKeluarStok, ket:'Produksi ('+rincianTxt+')'+(ket?': '+ket:'')});
      produksi.push({id:uid(), tanggal, premixItemId:produksiSelectedItemId, resepId:null, resepRincian, qtyPremix:totalResep, premixDiambil, varianHasil, totalHasil, ket, standarJadi, premixSeharusnya, trxId: trxRecProd?trxRecProd.id:null});
      await save('produksi', produksi);
      produksiSelectedItemId=null; produksiSelectedResepId=null;
      renderAll();
    };
  }
  const formManualVarian = document.getElementById('form-manual-varian');
  if(formManualVarian){
    formManualVarian.onsubmit = (e)=>{
      e.preventDefault();
      const nama = document.getElementById('manual-varian-nama').value.trim();
      const jumlah = parseFloat(document.getElementById('manual-varian-jumlah').value)||0;
      if(!nama || jumlah<=0) return;
      produksiManualRows.push({nama, jumlah});
      renderAll();
    };
  }
  document.querySelectorAll('[data-del-manual-varian]').forEach(b=>{
    b.onclick = ()=>{ produksiManualRows.splice(parseInt(b.dataset.delManualVarian),1); renderAll(); };
  });
  const fpm = document.getElementById('form-produksi-manual');
  if(fpm){
    fpm.onsubmit = async (e)=>{
      e.preventDefault();
      if(produksiManualRows.length===0) return;
      const fd = new FormData(fpm);
      const qtyPremix = parseFloat(fd.get('qtyPremix'))||0;
      const totalHasil = produksiManualRows.reduce((s,v)=>s+v.jumlah,0);
      const tanggal = fd.get('tanggal');
      const ket = fd.get('ket')||'';
      const trxRecManual = await tambahTrx({tanggal, itemId:produksiSelectedItemId, tipe:'keluar', qty:qtyPremix, ket:'Produksi'+(ket?': '+ket:'')});
      produksi.push({id:uid(), tanggal, premixItemId:produksiSelectedItemId, resepId:null, qtyPremix, varianHasil:[...produksiManualRows], totalHasil, ket, trxId: trxRecManual?trxRecManual.id:null});
      await save('produksi', produksi);
      produksiSelectedItemId=null; produksiManualRows=[];
      renderAll();
    };
  }
  document.querySelectorAll('[data-del-produksi]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.delProduksi;
      const p = produksi.find(x=>x.id===id);
      if(p){
        const qtyKeluarLama = p.premixDiambil!=null ? p.premixDiambil : (p.resepDiambilManual!=null ? p.resepDiambilManual : (p.qtyPremix||0));
        if(p.trxId){
          trx = trx.filter(t=>t.id!==p.trxId);
        } else {
          // format lama tanpa trxId tersimpan — cocokkan best-effort lalu hapus satu transaksi yang match
          const idx = trx.findIndex(t=>t.itemId===p.premixItemId && t.tipe==='keluar' && t.ket && t.ket.startsWith('Produksi') && Math.abs(t.qty-qtyKeluarLama)<0.0001 && t.tanggal===p.tanggal);
          if(idx>=0) trx.splice(idx,1);
        }
        await save('trx', trx);
      }
      produksi = produksi.filter(x=>x.id!==id);
      await save('produksi', produksi);
      renderAll();
    };
  });
  document.querySelectorAll('[data-edit-produksi]').forEach(b=>{
    b.onclick = ()=>{ editingRow = {dataset:'produksi', id:b.dataset.editProduksi}; renderAll(); };
  });
  document.querySelectorAll('[data-save-edit-produksi]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.saveEditProduksi;
      const p = produksi.find(x=>x.id===id); if(!p) return;
      const tr = document.querySelector(`[data-edit-row="produksi-${id}"]`);
      const before = {...p};
      p.qtyPremix = parseFloat(tr.querySelector('.edit-qty').value)||0;
      p.ket = tr.querySelector('.edit-ket').value||'';
      p.tanggal = tr.querySelector('.edit-tanggal').value;
      // recalc premix diambil (kg) proporsional kalau resepnya punya acuan kg
      const itForResep = itemById(p.premixItemId);
      const resepForEdit = itForResep ? (itForResep.resepList||[]).find(r=>r.id===p.resepId) : null;
      p.premixDiambil = (resepForEdit && resepForEdit.premixKg>0 && resepForEdit.resepQty>0) ? (p.qtyPremix/resepForEdit.resepQty)*resepForEdit.premixKg : null;
      const qtyKeluarBaru = p.premixDiambil!=null ? p.premixDiambil : p.qtyPremix;
      const qtyKeluarLama = before.premixDiambil!=null ? before.premixDiambil : before.qtyPremix;
      // qty premix keluar diedit juga menyesuaikan transaksi keluar yang tercatat otomatis dari produksi ini
      let trxTerkait = p.trxId ? trx.find(t=>t.id===p.trxId) : null;
      if(!trxTerkait){
        trxTerkait = trx.find(t=>t.itemId===p.premixItemId && t.tipe==='keluar' && t.ket && t.ket.startsWith('Produksi') && Math.abs(t.qty-qtyKeluarLama)<0.0001 && t.tanggal===before.tanggal);
      }
      if(trxTerkait){ trxTerkait.qty = qtyKeluarBaru; trxTerkait.tanggal = p.tanggal; await save('trx', trx); }
      await save('produksi', produksi);
      const it = itemById(p.premixItemId);
      await catatEdit('produksi', id, `Produksi — ${it?it.nama:''}`, before, p);
      editingRow = null;
      renderAll();
    };
  });

  // -- Packing: baris dinamis kardus/bahan pembungkus --
  function syncPackingBahanFromDom(){
    document.querySelectorAll('.packing-bahan-item').forEach(el=>{ const i=parseInt(el.dataset.idx); if(packingBahanRows[i]) packingBahanRows[i].itemId = el.value; });
    document.querySelectorAll('.packing-bahan-qty').forEach(el=>{ const i=parseInt(el.dataset.idx); if(packingBahanRows[i]) packingBahanRows[i].qty = el.value; });
  }
  document.querySelectorAll('.packing-bahan-item, .packing-bahan-qty').forEach(el=>{ el.onchange = syncPackingBahanFromDom; });
  const btnTambahBarisPackingBahan = document.getElementById('btn-tambah-baris-packing-bahan');
  if(btnTambahBarisPackingBahan){
    btnTambahBarisPackingBahan.onclick = ()=>{
      syncPackingBahanFromDom();
      packingBahanRows.push({itemId:'', qty:''});
      renderAll();
    };
  }
  document.querySelectorAll('[data-del-packing-bahan-row]').forEach(b=>{
    b.onclick = ()=>{
      syncPackingBahanFromDom();
      packingBahanRows.splice(parseInt(b.dataset.delPackingBahanRow),1);
      if(packingBahanRows.length===0) packingBahanRows=[{itemId:'', qty:''}];
      renderAll();
    };
  });

  const fk = document.getElementById('form-packing');
  if(fk){
    fk.onsubmit = async (e)=>{
      e.preventDefault();
      syncPackingBahanFromDom();
      const varian = [];
      document.querySelectorAll('.packing-jumlah').forEach(inp=>{
        const jumlah = parseFloat(inp.value)||0;
        if(jumlah>0) varian.push({ nama: inp.dataset.nama, jumlah });
      });
      if(varian.length===0){ alert('Isi minimal satu varian roti yang dikemas'); return; }
      const bahanRowsValid = packingBahanRows.filter(r=>r.itemId && parseFloat(r.qty)>0);
      if(bahanRowsValid.length===0){ alert('Isi minimal satu baris Kardus/Bahan Pembungkus yang dipakai (misal Kardus Besar, atau OPP Kecil)'); return; }
      const cabang = document.getElementById('packing-cabang').value;
      const ket = document.getElementById('packing-ket').value||'';
      const tanggal = document.getElementById('packing-tanggal').value;
      const ketTrx = 'Packing ke '+cabang+(ket?': '+ket:'');
      const bahanList = [];
      for(const r of bahanRowsValid){
        const qty = parseFloat(r.qty)||0;
        const trxRec = await tambahTrx({tanggal, itemId:r.itemId, tipe:'keluar', qty, ket:ketTrx});
        bahanList.push({itemId:r.itemId, qty, trxId:trxRec?trxRec.id:null});
      }
      packing.push({id:uid(), tanggal, cabang, varian, bahanList, ket});
      await save('packing', packing);
      packingBahanRows=[{itemId:'', qty:''}];
      renderAll();
    };
  }
  document.querySelectorAll('[data-del-packing]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.delPacking;
      const p = packing.find(x=>x.id===id); if(!p) return;
      const list = p.bahanList && p.bahanList.length>0 ? p.bahanList : (p.kardusItemId ? [{itemId:p.kardusItemId, qty:p.qtyKardus}] : []);
      list.forEach(bItem=>{
        if(bItem.trxId){
          trx = trx.filter(t=>t.id!==bItem.trxId);
        } else {
          // format lama tanpa trxId tersimpan — cocokkan best-effort lalu hapus satu transaksi yang match
          const idx = trx.findIndex(t=>t.itemId===bItem.itemId && t.tipe==='keluar' && t.ket && t.ket.startsWith('Packing ke') && Math.abs(t.qty-(bItem.qty||0))<0.0001 && t.tanggal===p.tanggal);
          if(idx>=0) trx.splice(idx,1);
        }
      });
      await save('trx', trx);
      packing = packing.filter(x=>x.id!==id);
      await save('packing', packing);
      renderAll();
    };
  });
  document.querySelectorAll('[data-edit-packing]').forEach(b=>{
    b.onclick = ()=>{ editingRow = {dataset:'packing', id:b.dataset.editPacking}; renderAll(); };
  });
  document.querySelectorAll('[data-save-edit-packing]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.saveEditPacking;
      const p = packing.find(x=>x.id===id); if(!p) return;
      const tr = document.querySelector(`[data-edit-row="packing-${id}"]`);
      const before = {...p};
      p.cabang = tr.querySelector('.edit-cabang').value;
      p.ket = tr.querySelector('.edit-ket').value||'';
      p.tanggal = tr.querySelector('.edit-tanggal').value;
      const ketTrx = 'Packing ke '+p.cabang+(p.ket?': '+p.ket:'');
      const list = p.bahanList && p.bahanList.length>0 ? p.bahanList : (p.kardusItemId ? [{itemId:p.kardusItemId, qty:p.qtyKardus, trxId:null}] : []);
      list.forEach(bItem=>{
        let trxTerkait = bItem.trxId ? trx.find(t=>t.id===bItem.trxId) : null;
        if(!trxTerkait){
          trxTerkait = trx.find(t=>t.itemId===bItem.itemId && t.tipe==='keluar' && t.ket && t.ket.startsWith('Packing ke') && Math.abs(t.qty-(bItem.qty||0))<0.0001 && t.tanggal===before.tanggal);
        }
        if(trxTerkait){ trxTerkait.tanggal = p.tanggal; trxTerkait.ket = ketTrx; }
      });
      await save('trx', trx);
      await save('packing', packing);
      await catatEdit('packing', id, `Packing — ${before.cabang}`, before, p);
      editingRow = null;
      renderAll();
    };
  });

  // -- Retur --
  const returJenisSelect = document.getElementById('retur-jenis-select');
  if(returJenisSelect){
    returJenisSelect.onchange = ()=>{ returJenis = returJenisSelect.value; renderAll(); };
  }
  const frp = document.getElementById('form-retur-premix');
  if(frp){
    frp.onsubmit = async (e)=>{
      e.preventDefault();
      const fd = new FormData(frp);
      const itemId = fd.get('itemId');
      const qty = parseFloat(fd.get('qty'))||0;
      const it = itemById(itemId); if(!it || qty<=0) return;
      const tanggal = fd.get('tanggal');
      const alasan = fd.get('alasan')||'';
      const nilai = qty*it.harga;
      const trxRecRetur = await tambahTrx({tanggal, itemId, tipe:'keluar', qty, ket:'Retur Premix ke Supplier'+(alasan?': '+alasan:'')});
      retur.push({id:uid(), tanggal, jenis:'premix', itemId, qty, nilai, alasan, trxId: trxRecRetur?trxRecRetur.id:null});
      await save('retur', retur);
      renderAll();
    };
  }
  const frr = document.getElementById('form-retur-roti');
  if(frr){
    frr.onsubmit = async (e)=>{
      e.preventDefault();
      const fd = new FormData(frr);
      const varianNama = fd.get('varianNama');
      const cabang = fd.get('cabang');
      const jumlah = parseFloat(fd.get('jumlah'))||0;
      if(!varianNama || !cabang || jumlah<=0) return;
      const tanggal = fd.get('tanggal');
      const nilai = parseFloat(fd.get('nilai'))||0;
      const alasan = fd.get('alasan')||'';
      retur.push({id:uid(), tanggal, jenis:'roti', varianNama, cabang, jumlah, nilai, alasan});
      await save('retur', retur);
      renderAll();
    };
  }
  document.querySelectorAll('[data-del-retur]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.delRetur;
      const r = retur.find(x=>x.id===id);
      if(r && r.jenis==='premix'){
        if(r.trxId){
          trx = trx.filter(t=>t.id!==r.trxId);
        } else {
          // format lama tanpa trxId tersimpan — cocokkan best-effort lalu hapus satu transaksi yang match
          const idx = trx.findIndex(t=>t.itemId===r.itemId && t.tipe==='keluar' && t.ket && t.ket.startsWith('Retur Premix ke Supplier') && Math.abs(t.qty-(r.qty||0))<0.0001 && t.tanggal===r.tanggal);
          if(idx>=0) trx.splice(idx,1);
        }
        await save('trx', trx);
      }
      retur = retur.filter(x=>x.id!==id);
      await save('retur', retur);
      renderAll();
    };
  });

  const fj = document.getElementById('form-jual');
  if(fj){
    fj.onsubmit = async (e)=>{
      e.preventDefault();
      const fd = new FormData(fj);
      penjualan.push({id:uid(), tanggal: fd.get('tanggal'), omzet: parseFloat(fd.get('omzet'))||0, ket: fd.get('ket')||''});
      await save('penjualan', penjualan);
      renderAll();
    };
  }
  document.querySelectorAll('[data-del-jual]').forEach(b=>{
    b.onclick = async ()=>{ penjualan = penjualan.filter(p=>p.id!==b.dataset.delJual); await save('penjualan', penjualan); renderAll(); };
  });

  const fd0 = document.getElementById('form-dashboard');
  if(fd0){
    fd0.onsubmit = (e)=>{
      e.preventDefault();
      hitungDashboard(document.getElementById('dash-dari').value, document.getElementById('dash-sampai').value);
    };
    hitungDashboard(document.getElementById('dash-dari').value, document.getElementById('dash-sampai').value);
  }

  const fl = document.getElementById('form-laporan');
  if(fl){
    fl.onsubmit = (e)=>{ e.preventDefault(); hitungLaporan(document.getElementById('lap-dari').value, document.getElementById('lap-sampai').value); };
    const now = new Date();
    const first = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0,10);
    const last = today();
    document.getElementById('lap-dari').value = first;
    document.getElementById('lap-sampai').value = last;
    hitungLaporan(first, last);
  }

  const flSel = document.getElementById('form-lap-selisih');
  if(flSel){
    flSel.onsubmit = (e)=>{
      e.preventDefault();
      hitungLaporanSelisih(
        document.getElementById('lapsel-dari').value,
        document.getElementById('lapsel-sampai').value,
        document.getElementById('lapsel-barang').value,
        document.getElementById('lapsel-kategori').value
      );
    };
    const nowSel = new Date();
    const firstSel = new Date(nowSel.getFullYear(), nowSel.getMonth(), 1).toISOString().slice(0,10);
    const lastSel = today();
    document.getElementById('lapsel-dari').value = firstSel;
    document.getElementById('lapsel-sampai').value = lastSel;
    hitungLaporanSelisih(firstSel, lastSel, '', '');
  }

  const btnCopySore = document.getElementById('btn-copy-laporan-sore');
  if(btnCopySore){
    btnCopySore.onclick = async ()=>{
      const status = document.getElementById('copy-status');
      try{
        await navigator.clipboard.writeText(teksLaporanSore());
        if(status) status.textContent = 'Tersalin! Tempel (paste) ke chat WhatsApp.';
      }catch(e){
        if(status) status.textContent = 'Gagal menyalin otomatis — salin manual dari tabel di bawah.';
      }
    };
  }
}

(function initDataTools(){
  const btnExport = document.getElementById('btn-export-excel');
  const btnImport = document.getElementById('btn-import-excel');
  const inputImport = document.getElementById('input-import-excel');
  const btnRefresh = document.getElementById('btn-refresh-db');
  if(btnExport) btnExport.onclick = exportExcel;
  if(btnImport) btnImport.onclick = ()=> inputImport.click();
  if(inputImport) inputImport.onchange = (e)=>{
    const file = e.target.files[0];
    if(file) importExcel(file);
    inputImport.value = '';
  };
  if(btnRefresh) btnRefresh.onclick = async ()=>{
    btnRefresh.disabled = true;
    await loadAll();
    updateDbStatusBadge();
    renderAll();
    btnRefresh.disabled = false;
  };
})();

(async function init(){
  await loadAll();
  updateDbStatusBadge();
  renderAll();
  subscribeRealtime();
})();

</script>

</body></html>
